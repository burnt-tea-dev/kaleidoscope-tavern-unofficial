name: Apply verified foundation patch
on:
  push:
    branches: [refactor/shared-foundation-20260925]
    paths: ['.github/workflows/apply-foundation.yml']
permissions:
  contents: write
jobs:
  apply:
    if: github.repository == 'casama233/kaleidoscope-tavern-unofficial' && github.ref == 'refs/heads/refactor/shared-foundation-20260925'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Verify and apply locally tested source bytes
        run: |
          test "$(git rev-parse HEAD^)" = 16be94bbb726bbbdeb931e28bbd30628fa2bfbf0
          python - <<'PY'
          from pathlib import Path
          import lzma,hashlib
          compressed=Path('.foundation-transfer/part1').read_bytes()+Path('.foundation-transfer/part2').read_bytes()
          patch=lzma.decompress(compressed)
          assert len(patch)==89673
          assert hashlib.sha256(patch).hexdigest()=='826a9bf8334e65d6ada0ef2de102f38720dc2ffd7e8b92c765487bf660a74740'
          Path('/tmp/foundation.patch').write_bytes(patch)
          PY
          git apply --check --unidiff-zero /tmp/foundation.patch
          git apply --index --unidiff-zero /tmp/foundation.patch
          git rm -- .foundation-transfer/part1 .foundation-transfer/part2 .github/workflows/apply-foundation.yml
          test "$(git write-tree)" = c830a3218f636d537dd9ee6f8f61994b29b3bc04
          # This token only commits code. Workflow finalization is a separate connector write.
          git restore --source=HEAD --staged --worktree -- .github/workflows/foundation-ci.yml .github/workflows/apply-foundation.yml .foundation-transfer/part1 .foundation-transfer/part2
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'refactor: host cabinet transactions and external effect lifecycle with acknowledged pack migration'
          git push origin HEAD:refs/heads/refactor/shared-foundation-20260925
