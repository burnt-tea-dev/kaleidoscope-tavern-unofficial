name: Shared foundation regression
on:
  push:
    branches: [refactor/shared-foundation-20260925, integration/reviewed-0.6.44]
  pull_request:
    paths:
      - 'runtime/**'
      - 'sdk/**'
      - 'data/**'
      - 'tools/**'
      - '.github/workflows/foundation-ci.yml'
permissions:
  contents: read
jobs:
  foundation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: tavern
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: casama233/kaleidoscope-world-liquor-unofficial
          # Reviewed 0.1.44 preserves color groups and adds friend source labels for Tavern 0.6.79.
          # Pin exact peer bytes, not an obsolete release or a moving branch.
          ref: 9b2cb76701ce1e6a6a720e89eb66dea3bb3db6f3
          path: liquor
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Record exact integration inputs
        run: |
          mkdir -p evidence
          git -C tavern rev-parse HEAD > evidence/TAVERN_COMMIT
          git -C liquor rev-parse HEAD > evidence/LIQUOR_COMMIT
      - name: Cross-pack script regressions (not Minecraft client or BDS)
        working-directory: tavern
        env:
          LIQUOR_SOURCE: ${{ github.workspace }}/liquor
        run: |
          set -o pipefail
          node --experimental-loader ./tools/foundation/mock-loader.mjs --test tools/foundation/foundation.test.mjs tools/creative-pick.test.mjs tools/pr-integration.test.mjs tools/break-feedback.test.mjs tools/grass-stealth-adapter.test.mjs tools/java-parity-adapter.test.mjs tools/barrel-materials.test.mjs tools/addon-mixology-tags.test.mjs tools/drink-source-labels.test.mjs 2>&1 | tee ../evidence/foundation-and-pick-tests.tap
          python tools/test_pick_block.py 2>&1 | tee ../evidence/native-pick-tests.log
          python tools/creative/test_catalog.py 2>&1 | tee ../evidence/creative-tests.log
      - name: Simple effect bar and paired name checks (no client rendering)
        working-directory: tavern
        env:
          LIQUOR_SOURCE: ${{ github.workspace }}/liquor
        run: |
          set -o pipefail
          python ../liquor/tools/test_effect_names.py
          python ../liquor/tools/build_effect_names.py --check
          node --test tools/effect-bar.test.mjs tools/grass-stealth.test.mjs tools/java-parity.test.mjs 2>&1 | tee ../evidence/effect-bar-tests.tap
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shared-foundation-regressions
          path: evidence/
          retention-days: 14
