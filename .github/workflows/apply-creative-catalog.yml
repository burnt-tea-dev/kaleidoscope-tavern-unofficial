name: Apply verified creative catalog
on:
  push:
    branches: [refactor/shared-foundation-20260925]
    paths: ['.github/workflows/apply-creative-catalog.yml']
permissions:
  contents: write
jobs:
  apply:
    if: github.repository == 'casama233/kaleidoscope-tavern-unofficial' && github.ref == 'refs/heads/refactor/shared-foundation-20260925'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Apply checked metadata-only runtime patch
        run: |
          test "$(git rev-parse HEAD^)" = bc10d98e28958b6ccbe8f43b7d4c3ad4de5938cc
          python - <<'PY'
          import hashlib,lzma
          from pathlib import Path
          patch=lzma.decompress(Path('.creative-transfer/part1').read_bytes()+Path('.creative-transfer/part2').read_bytes())
          assert len(patch)==106659
          assert hashlib.sha256(patch).hexdigest()=='0107e99559aa46dd8cbf108850e00303728eee8cdba20ff3989d540f8059e5ec'
          Path('/tmp/creative.patch').write_bytes(patch)
          PY
          git apply --check --unidiff-zero /tmp/creative.patch
          git apply --index --unidiff-zero /tmp/creative.patch
          test "$(git rev-parse "$(git write-tree):runtime")" = 9493fb0a245fbb1965e4d6d11c29d7980b206d10
          python tools/creative/catalog.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat: organize native creative decorations into shared collapsible groups'
          git push origin HEAD:refs/heads/refactor/shared-foundation-20260925
