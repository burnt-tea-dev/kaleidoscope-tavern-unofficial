name: Repair integration snapshot
on:
  push:
    branches: ['release/0.6.39-repairs']
    paths: ['.github/workflows/repair-snapshot.yml']
permissions:
  contents: read
jobs:
  snapshot:
    if: github.repository == 'casama233/kaleidoscope-tavern-unofficial' && github.repository_id == '1377171148'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: tavern-src
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: casama233/kaleidoscope-world-liquor-unofficial
          ref: 62e473f51bea18c9179def290f23a93498f0c957
          path: world-liquor-src
          persist-credentials: false
      - name: Archive pinned sources
        run: |
          mkdir snapshots
          git -C tavern-src archive --format=zip HEAD > snapshots/tavern-source.zip
          git -C world-liquor-src archive --format=zip HEAD > snapshots/world-liquor-source.zip
      - uses: actions/upload-artifact@v4
        with:
          name: repair-integration-sources
          path: snapshots/*.zip
          retention-days: 7
