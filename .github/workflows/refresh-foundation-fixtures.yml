name: Refresh current foundation test fixtures
on:
  push:
    branches: ['fix/effects-report-followup-20260928']
    paths: ['tools/foundation/refresh-current-fixtures.py', '.github/workflows/refresh-foundation-fixtures.yml']
permissions:
  contents: write
jobs:
  fixture-repair:
    if: github.repository == 'casama233/kaleidoscope-tavern-unofficial'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          path: tavern
      - uses: actions/checkout@v4
        with:
          repository: casama233/kaleidoscope-world-liquor-unofficial
          ref: b6d52c65ca314afc24fb3eaa87eebb7755dce71f
          path: liquor
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Update current test contracts without changing historical files
        working-directory: tavern
        run: python tools/foundation/refresh-current-fixtures.py
      - name: Full shared foundation, pick, category and effect-bar regressions
        working-directory: tavern
        env:
          LIQUOR_SOURCE: ${{ github.workspace }}/liquor
        run: |
          set -euo pipefail
          mkdir -p ../evidence
          node --experimental-loader ./tools/foundation/mock-loader.mjs --test tools/foundation/foundation.test.mjs tools/creative-pick.test.mjs tools/pr-integration.test.mjs 2>&1 | tee ../evidence/foundation-tests.tap
          python tools/test_pick_block.py | tee ../evidence/native-pick.txt
          python tools/creative/test_catalog.py | tee ../evidence/creative-catalog.txt
          python ../liquor/tools/build_effect_names.py --check
          node --test tools/effect-bar.test.mjs | tee ../evidence/effect-bar.tap
          git diff --exit-code -- runtime history
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Current-foundation-fixture-validation
          path: evidence/
          retention-days: 14
      - name: Commit only verified test updates
        working-directory: tavern
        env:
          EXPECTED_HEAD: ${{ github.sha }}
        run: |
          set -euo pipefail
          branch=fix/effects-report-followup-20260928
          test "$(git ls-remote origin refs/heads/$branch | cut -f1)" = "$EXPECTED_HEAD"
          git add tools/foundation/mock-loader.mjs tools/foundation/foundation.test.mjs tools/creative-pick.test.mjs
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'test: align shared fixtures with native potion delivery, empty-hand pickup and entity validity'
          git push origin HEAD:refs/heads/$branch
