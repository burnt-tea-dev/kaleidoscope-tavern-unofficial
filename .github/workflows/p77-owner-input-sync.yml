name: Synchronize P77 owner inputs
on:
  push:
    branches: [feat/26-60-p77-catalog]
    paths: [.github/workflows/p77-owner-input-sync.yml]
permissions:
  contents: write
jobs:
  sync:
    if: github.repository == 'burnt-tea-dev/kaleidoscope-tavern-unofficial'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          ref: feat/26-60-p77-catalog
      - name: Merge the reviewed parent without reverting P77 or accepted inputs
        shell: bash
        run: |
          git config user.name 'Cary development assistant'
          git config user.email '97009482+casama233@users.noreply.github.com'
          python3 - <<'PY'
          import copy,hashlib,json,pathlib,subprocess
          root=pathlib.Path.cwd();path='tools/stable_host_profiles.json'
          old='dc3d16474831e0db72448e7becda5d2ccc11eeb3'
          parent='f2d8babe6197f41e0dc3955e94540f44b387228c'
          def read(ref):return json.loads(subprocess.check_output(['git','show',ref+':'+path]))
          original,latest,ours=read(old),read(parent),read('HEAD')
          assert ours['current_author_curated']['version']==[1,0,77]
          assert latest['current_author_curated']['version']==[1,0,76]
          assert {k:ours['profiles'][k] for k in original['profiles']}==original['profiles'],'P77 modified historical profiles'
          new_profiles={k:v for k,v in ours['profiles'].items() if k not in original['profiles']}
          assert not new_profiles.keys() & latest['profiles'].keys(),'Concurrent P77 profile owner'
          latest['profiles'].update(new_profiles)
          current=copy.deepcopy(ours['current_author_curated'])
          selection=current['selection']['value']
          parent_selection=latest['current_author_curated']['selection']['value']
          for name in ('retained_inputs','replacement_packs'):
              assert name in parent_selection
              selection[name]=copy.deepcopy(parent_selection[name])
          encoded=lambda value:(json.dumps(value,ensure_ascii=False,indent=2)+'\n').encode()
          current['selection']['sha256']=hashlib.sha256(encoded(selection)).hexdigest()
          latest['current_author_curated']=current
          result=subprocess.run(['git','merge','--no-ff','--no-commit',parent])
          conflicts=subprocess.check_output(['git','diff','--name-only','--diff-filter=U'],text=True).splitlines()
          assert set(conflicts)<={path} and result.returncode in (0,1),'Unexpected merge conflict'
          (root/path).write_bytes(encoded(latest))
          (root/'.github/workflows/p77-owner-input-sync.yml').unlink()
          subprocess.run(['git','add','-A'],check=True)
          subprocess.run(['git','commit','-m','chore: retain concurrent hotfix4 and whole-pair replacement assembly in P77'],check=True)
          print('P77 selection SHA256:',current['selection']['sha256'])
          PY
          python3 tools/baseline_gate.py check --release
          python3 -m unittest discover -s tools -p test_doll_renderer_extension.py
          python3 -m unittest discover -s tools -p test_owner_accepted_inputs.py
          git push origin HEAD:refs/heads/feat/26-60-p77-catalog
          git show -s --format='%H %T' HEAD
