name: Integrate P77 exact peer pins
on:
  push:
    branches: [feat/26-60-p77-catalog]
    paths: [.github/workflows/p77-final-peer-sync.yml]
permissions:
  contents: write
jobs:
  sync:
    if: github.repository == 'burnt-tea-dev/kaleidoscope-tavern-unofficial'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          ref: feat/26-60-p77-catalog
      - name: Integrate parent metadata and select actual G183 source
        shell: bash
        run: |
          git config user.name 'Cary development assistant'
          git config user.email '97009482+casama233@users.noreply.github.com'
          python3 - <<'PY'
          import copy,json,os,pathlib,subprocess
          root=pathlib.Path.cwd();parent='4c92aea4b31463113e4ae4020b0b45462c089d4b'
          path='tools/stable_host_profiles.json'
          ours=json.loads((root/path).read_bytes())
          old=json.loads(subprocess.check_output(['git','show','f2d8babe6197f41e0dc3955e94540f44b387228c:'+path]))
          latest=json.loads(subprocess.check_output(['git','show',parent+':'+path]))
          assert ours['current_author_curated']['version']==[1,0,77]
          assert latest['current_author_curated']['version']==[1,0,76]
          latest['profiles'].update({k:v for k,v in ours['profiles'].items() if k not in old['profiles']})
          latest['current_author_curated']=ours['current_author_curated']
          for name in ('retained_inputs','replacement_packs'):
              original_selection=json.loads(subprocess.check_output(['git','show',parent+':'+path]))['current_author_curated']['selection']['value']
              assert latest['current_author_curated']['selection']['value'][name]==original_selection[name],'New owner inputs need a coordinated selection refresh'
          bundle=(root/'tools/family_bundle.py').read_bytes()
          result=subprocess.run(['git','merge','--no-ff','--no-commit',parent])
          conflicts=subprocess.check_output(['git','diff','--name-only','--diff-filter=U'],text=True).splitlines()
          assert set(conflicts)<={path,'tools/family_bundle.py'} and result.returncode in (0,1),conflicts
          (root/path).write_text(json.dumps(latest,ensure_ascii=False,indent=2)+'\n')
          # The parent's None-default repair is already included in the stronger
          # complete-pair implementation. Keep its regression cases unchanged.
          (root/'tools/family_bundle.py').write_bytes(bundle)
          workflow=root/'.github/workflows/validation.yml';s=workflow.read_text()
          s=s.replace('1279162e632c7ae3e556c18503adf0919267ced5','8085291165ee7a2c1f224a132e098eb61797a5c7')
          s=s.replace('World Liquor164 requires this paired Tavern185 runtime.','World Liquor168 requires this paired Tavern187 runtime.')
          workflow.write_text(s)
          peer=pathlib.Path(os.environ['RUNNER_TEMP'])/'grilling-g183'
          subprocess.run(['git','clone','--quiet','https://github.com/burnt-tea-dev/kaleidoscope-grilling-unofficial.git',str(peer)],check=True)
          subprocess.run(['git','checkout','--quiet','--detach','8085291165ee7a2c1f224a132e098eb61797a5c7'],cwd=peer,check=True)
          baseline=json.loads((peer/'baseline.json').read_bytes());assert baseline['version']==[2,8,183]
          lock_path=root/'family/upstream.lock.json';lock=json.loads(lock_path.read_bytes())
          row=next(row for row in lock['owned'] if row['key']=='grilling')
          assert row['version']==[2,8,182]
          row['version']=baseline['version'];row['source_trees']=baseline['source_trees']
          lock_path.write_text(json.dumps(lock,ensure_ascii=False,indent=2)+'\n')
          (root/'.github/workflows/p77-final-peer-sync.yml').unlink()
          PY
          python3 -m unittest discover -s tools -p test_family_bundle.py
          python3 -m unittest discover -s tools/family_update -p test_build_order.py
          git add -A
          git commit -m 'chore: integrate concurrent parent sources and pair P77 with G183'
          python3 tools/baseline_gate.py check --release
          git push origin HEAD:refs/heads/feat/26-60-p77-catalog
          git show -s --format='%H %T' HEAD
