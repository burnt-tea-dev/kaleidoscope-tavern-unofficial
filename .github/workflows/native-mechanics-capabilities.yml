name: Native mechanics capability probe
on:
  push:
    branches: [test/native-mechanics-capabilities-20260929]
    paths: [.github/workflows/native-mechanics-capabilities.yml]
permissions:
  contents: read
jobs:
  native:
    if: github.repository == 'casama233/kaleidoscope-tavern-unofficial' && github.repository_id == '1377171148'
    runs-on: ubuntu-22.04
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 16cc01c6eb562fb0cf649d52108bfa66428bec9e
          persist-credentials: false
      - name: Execute the immutable native fixture with HTTP1 transport
        run: |
          python3 - <<'PY'
          import pathlib,subprocess
          text=pathlib.Path('.github/workflows/native-mechanics-capabilities.yml').read_text()
          lines=text.splitlines();scripts=[]
          for i,line in enumerate(lines):
              if line=='        run: |':
                  body=[]
                  for s in lines[i+1:]:
                      if s and not s.startswith('          '):break
                      body.append(s[10:] if s else '')
                  scripts.append('\n'.join(body))
          assert len(scripts)==3,'Pinned fixture changed'
          scripts[0]=scripts[0].replace('curl --fail','curl --http1.1 --retry-all-errors -A "Mozilla/5.0" --fail')
          for script in scripts:subprocess.run(['bash','-e','-c',script],check=True)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Tavern-native-capabilities-1.26.51.1
          path: evidence/
          retention-days: 14
