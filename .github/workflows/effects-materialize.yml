name: Materialize tested effects follow-up
on:
  push:
    branches: ['fix/effects-report-followup-20260928']
    paths: ['.github/effects-stage/**', '.github/workflows/effects-materialize.yml']
permissions:
  contents: write
concurrency:
  group: effects-followup-materialize
  cancel-in-progress: false
jobs:
  repair:
    if: github.repository == 'casama233/kaleidoscope-tavern-unofficial' && github.ref == 'refs/heads/fix/effects-report-followup-20260928'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          path: bedrock
          fetch-depth: 0
      - uses: actions/checkout@v4
        with:
          repository: KaleidoscopeMods/KaleidoscopeTavern
          ref: c4ec1880bd44cf3139d3ba744ab30bb379cf1416
          path: java
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: casama233/kaleidoscope-tavern-unofficial
          ref: cedfaedf6140bae61b24afb658869b1d0e6ea1a9
          path: baseline
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install Pillow==11.3.0
      - name: Collect hash-verified original particle assets
        run: python bedrock/tools/effects/collect_reference.py vanilla-reference
      - name: Apply exact reviewed patch and regenerate bounded assets
        working-directory: bedrock
        run: python .github/effects-stage/apply.py
      - name: Run all 105 unique effect tests
        working-directory: bedrock
        run: |
          set -o pipefail
          node --experimental-vm-modules --test tools/effects/effects-regression.test.mjs tools/effects/interaction-regression.test.mjs | tee ../effect-tests.txt
      - name: Full release static checks
        working-directory: bedrock
        run: |
          set -o pipefail
          python tools/check_release.py | tee ../release-checks.txt
          python tools/check_storage_rendering.py --java-source ../java --report ../storage-validation.json
          python tools/check_launch.py --java-source ../java --baseline ../baseline | tee ../baseline-check.txt
      - name: Save inspectable diff and evidence
        if: always()
        working-directory: bedrock
        run: |
          mkdir -p ../evidence
          cp ../effect-tests.txt ../release-checks.txt ../baseline-check.txt ../storage-validation.json ../evidence/ 2>/dev/null || true
          if test -f docs/EFFECTS-REPORT-FOLLOWUP-20260928.md; then cp docs/EFFECTS-REPORT-FOLLOWUP-20260928.md ../evidence/; fi
          git diff --binary -- runtime tools data docs .github/workflows/effects-parity.yml > ../evidence/followup.patch
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Effects-followup-validation
          path: evidence/
          retention-days: 14
      - name: Commit only tested source to the existing repair branch
        working-directory: bedrock
        env:
          EXPECTED_HEAD: ${{ github.sha }}
        run: |
          set -euo pipefail
          branch=fix/effects-report-followup-20260928
          actual=$(git ls-remote origin "refs/heads/$branch" | cut -f1)
          test "$actual" = "$EXPECTED_HEAD"
          git restore -- docs/LAUNCH-VALIDATION-0.6.63.json docs/REPAIR-STATIC-0.6.63.json .github/workflows/effects-parity.yml
          # GITHUB_TOKEN has contents permission, not workflows permission.
          # The authorized connector removes this one-time workflow afterwards.
          git rm -r .github/effects-stage
          git add -u
          # Never force-add official client reference archives or other ignored files.
          git ls-files --others --exclude-standard -z -- runtime tools data docs | xargs -0 -r git add --
          test -z "$(git diff --cached --name-only -- .github/workflows)"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: restore audited interaction particles, debris and splash effects with 105 regression tests'
          git push origin "HEAD:refs/heads/$branch"
