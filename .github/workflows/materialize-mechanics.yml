name: Assemble verified mechanics integration
on:
  push:
    branches: [fix/mechanics-completion-20260929]
    paths: [.github/workflows/materialize-mechanics.yml]
permissions:
  contents: read
jobs:
  integrate:
    if: github.repository == 'casama233/kaleidoscope-tavern-unofficial' && github.repository_id == '1377171148'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/checkout@v4
        with:
          repository: KaleidoscopeMods/KaleidoscopeTavern
          ref: c4ec1880bd44cf3139d3ba744ab30bb379cf1416
          path: .source-check/java
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: casama233/kaleidoscope-tavern-unofficial
          ref: cedfaedf6140bae61b24afb658869b1d0e6ea1a9
          path: .source-check/integration-baseline
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Reuse immutable verified source plan and preserve all reviewed ancestors
        run: |
          python3 - <<'PY'
          import subprocess,pathlib
          text=subprocess.check_output(['git','show','35d7ce1f35f2c217168112ab4c504b8f35ad165e:.github/workflows/materialize-mechanics.yml'],text=True)
          lines=text.splitlines();scripts=[]
          for i,line in enumerate(lines):
              if line=='        run: |':
                  body=[]
                  for s in lines[i+1:]:
                      if s and not s.startswith('          '):break
                      body.append(s[10:] if s else '')
                  scripts.append('\n'.join(body))
          assert len(scripts)==3
          for n in [94,96,97]:subprocess.run(['git','fetch','origin',f'pull/{n}/head:refs/heads/integration-pr{n}'],check=True)
          assert subprocess.check_output(['git','rev-parse','integration-pr94'],text=True).strip()=='7f0e8f5631630756aca97f11d6a0f0af6189ed86'
          # PR94's final shared fixture/Molang changes were incorporated and pass
          # in PR95 plus our extracted fixture; retain its independent tip as a parent.
          scripts[2]=scripts[2].replace('set -euo pipefail','set -euxo pipefail').replace('-p b121a48733d1cfa5cbb8f55b519b8a79de5c3194)','-p b121a48733d1cfa5cbb8f55b519b8a79de5c3194 -p 7f0e8f5631630756aca97f11d6a0f0af6189ed86)')
          scripts[2]=scripts[2].replace('validated-source.bundle validated-mechanics','validated-source.bundle validated-mechanics integration-pr96 integration-pr97')
          for script in scripts:subprocess.run(['bash','-e','-c',script],check=True)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Tavern-verified-mechanics-integration-0.6.64
          path: dist/
          retention-days: 14
