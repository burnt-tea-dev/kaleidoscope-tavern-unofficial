name: Particle Molang source snapshot (temporary)
on:
  push:
    branches: [fix/particle-molang-064-20260929]
    paths: [.github/workflows/particle-molang-snapshot.yml]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 1547140897fa067ea60e990ecdd8d23a85fa6815
          fetch-depth: 0
          persist-credentials: false
      - name: Export exact sources and immutable launch baseline
        shell: bash
        run: |
          set -euo pipefail
          dest="$RUNNER_TEMP/particle-molang-source"
          mkdir -p "$dest/port" "$dest/baseline" "$dest/java"
          git archive HEAD | tar -x -C "$dest/port"
          git ls-tree -r HEAD > "$dest/main-tree.txt"
          git archive cedfaedf6140bae61b24afb658869b1d0e6ea1a9 | tar -x -C "$dest/baseline"
          git clone --quiet https://github.com/KaleidoscopeMods/KaleidoscopeTavern.git "$RUNNER_TEMP/java-source"
          git -C "$RUNNER_TEMP/java-source" checkout --quiet c4ec1880bd44cf3139d3ba744ab30bb379cf1416
          git -C "$RUNNER_TEMP/java-source" archive HEAD | tar -x -C "$dest/java"
          find "$dest" -type f \( -iname '*.ttf' -o -iname '*.otf' -o -iname '*.woff*' \) -delete
          tar -cJf "$RUNNER_TEMP/particle-molang-source.tar.xz" -C "$RUNNER_TEMP" particle-molang-source
          sha256sum "$RUNNER_TEMP/particle-molang-source.tar.xz"
      - uses: actions/upload-artifact@v4
        with:
          name: particle-molang-source
          path: ${{ runner.temp }}/particle-molang-source.tar.xz
          retention-days: 3
          if-no-files-found: error
