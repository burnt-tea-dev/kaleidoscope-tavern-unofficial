name: Storage coordinate source snapshot (temporary)
on:
  push:
    branches: [fix/storage-hit-render-20260929]
    paths: [.github/workflows/storage-coordinate-snapshot.yml]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 8add56c2bb8a9d5a6de18dee176cdf88bf87b08b
          fetch-depth: 0
          persist-credentials: false
      - name: Export pinned public sources and audit baseline
        shell: bash
        run: |
          set -euo pipefail
          dest="$RUNNER_TEMP/storage-coordinate-source"
          mkdir -p "$dest/port" "$dest/baseline" "$dest/java" "$dest/liquor"
          git archive HEAD | tar -x -C "$dest/port"
          git ls-tree -r HEAD > "$dest/main-tree.txt"
          git log -15 --format='%H %s' > "$dest/main-history.txt"
          git archive cedfaedf6140bae61b24afb658869b1d0e6ea1a9 | tar -x -C "$dest/baseline"
          git clone --quiet https://github.com/KaleidoscopeMods/KaleidoscopeTavern.git "$RUNNER_TEMP/java-source"
          git -C "$RUNNER_TEMP/java-source" checkout --quiet c4ec1880bd44cf3139d3ba744ab30bb379cf1416
          git -C "$RUNNER_TEMP/java-source" archive HEAD | tar -x -C "$dest/java"
          git clone --quiet https://github.com/casama233/kaleidoscope-world-liquor-unofficial.git "$RUNNER_TEMP/liquor-source"
          git -C "$RUNNER_TEMP/liquor-source" checkout --quiet ce8c41e48c731985221945479650de121e4d477c
          git -C "$RUNNER_TEMP/liquor-source" archive HEAD | tar -x -C "$dest/liquor"
          find "$dest" -type f \( -iname '*.ttf' -o -iname '*.otf' -o -iname '*.woff*' \) -delete
          tar -cJf "$RUNNER_TEMP/storage-coordinate-source.tar.xz" -C "$RUNNER_TEMP" storage-coordinate-source
          sha256sum "$RUNNER_TEMP/storage-coordinate-source.tar.xz"
      - uses: actions/upload-artifact@v4
        with:
          name: storage-coordinate-source
          path: ${{ runner.temp }}/storage-coordinate-source.tar.xz
          retention-days: 3
          if-no-files-found: error
