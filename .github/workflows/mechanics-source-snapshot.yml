name: Mechanics source snapshot
on:
  push:
    branches: [fix/mechanics-completion-20260929]
    paths: [.github/workflows/mechanics-source-snapshot.yml]
permissions:
  contents: read
jobs:
  snapshot:
    if: github.repository == 'casama233/kaleidoscope-tavern-unofficial' && github.repository_id == '1377171148'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Export public source objects only (no Git config or credentials)
        run: |
          set -euo pipefail
          mkdir -p snapshot
          for pr in 91 93 94 95; do
            git fetch origin "pull/$pr/head:refs/heads/audit-pr-$pr"
          done
          git fetch origin main:refs/heads/audit-main
          git bundle create snapshot/tavern-source.bundle HEAD refs/heads/audit-main refs/heads/audit-pr-91 refs/heads/audit-pr-93 refs/heads/audit-pr-94 refs/heads/audit-pr-95
          git for-each-ref --format='%(refname) %(objectname)' refs/heads/audit- > snapshot/refs.txt
          curl --fail --location --retry 3 https://codeload.github.com/KaleidoscopeMods/KaleidoscopeTavern/tar.gz/c4ec1880bd44cf3139d3ba744ab30bb379cf1416 -o snapshot/java-source.tar.gz
          sha256sum snapshot/* > snapshot/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: Tavern-mechanics-source-snapshot
          path: snapshot/
          retention-days: 3
