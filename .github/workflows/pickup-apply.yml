name: Apply reviewed pickup repairs (temporary)
on:
  push:
    branches: [fix/pickup-parity-20260929]
    paths: [.github/workflows/pickup-apply.yml]
permissions:
  contents: write
concurrency:
  group: pickup-repair-apply
  cancel-in-progress: false
jobs:
  apply:
    if: github.repository == 'casama233/kaleidoscope-tavern-unofficial' && github.ref == 'refs/heads/fix/pickup-parity-20260929'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install Pillow==11.3.0
      - name: Verify pinned transport, source and output hashes
        shell: python
        run: |
          import base64,hashlib,json,lzma,pathlib,subprocess,urllib.request,os
          root=pathlib.Path.cwd()
          text=''.join((root/f'.pickup-transfer/part{i}.b64').read_text().strip() for i in range(4))
          packed=base64.b64decode(text,validate=True)
          assert hashlib.sha256(packed).hexdigest()=='facfcce64ac6295243120f5d9f1d64345b2ba6763fd7131d73b06f0a1a9293a9','Transport SHA mismatch'
          bundle=json.loads(lzma.decompress(packed))
          assert bundle['base']=='f793a98a0180e1948f98e69a8ca879a028884e38'
          subprocess.run(['git','merge-base','--is-ancestor',bundle['base'],'HEAD'],check=True)
          for name,row in bundle['changes'].items():
              relative=pathlib.PurePosixPath(name)
              assert not relative.is_absolute() and '..' not in relative.parts
              assert relative.parts[0] in {'runtime','tools','docs','data'} or name=='.github/workflows/pickup-parity.yml'
              path=root/name
              if row['before'] is None:
                  assert not path.exists(),f'Unexpected existing new file: {name}'
                  raw=row['content'].encode('utf-8')
              else:
                  original=path.read_bytes()
                  assert hashlib.sha256(original).hexdigest()==row['before'],f'Source changed: {name}'
                  lines=original.decode('utf-8').splitlines(keepends=True)
                  for start,end,replacement in reversed(row['ops']):
                      assert 0 <= start <= end <= len(lines)
                      lines[start:end]=[replacement]
                  raw=''.join(lines).encode('utf-8')
              assert hashlib.sha256(raw).hexdigest()==row['after'],f'Output mismatch: {name}'
              path.parent.mkdir(parents=True,exist_ok=True);path.write_bytes(raw)
          reference=json.loads((root/'data/pickup-java-audio-reference.json').read_text())
          for name,row in reference['assets'].items():
              assert name.startswith('sounds/kt_pickup/') and '..' not in pathlib.PurePosixPath(name).parts
              sha=row['sha1'];url=f'https://resources.download.minecraft.net/{sha[:2]}/{sha}'
              with urllib.request.urlopen(url,timeout=45) as response:raw=response.read()
              assert hashlib.sha1(raw).hexdigest()==sha
              assert hashlib.sha256(raw).hexdigest()==row['sha256']
              path=root/'runtime/RP'/name;path.parent.mkdir(parents=True,exist_ok=True);path.write_bytes(raw)
          for name,sha in bundle['files'].items():
              assert hashlib.sha256((root/name).read_bytes()).hexdigest()==sha,f'Final mismatch: {name}'
          (pathlib.Path(os.environ['RUNNER_TEMP'])/'pickup-files.json').write_text(json.dumps(bundle['files']))
          print(f'Verified {len(bundle["files"])} reviewed files')
      - name: Pure pickup and glassware tests
        run: node --test tools/pickup/core.test.mjs tools/glassware/hit-basis.test.mjs
      - name: Adapter integration tests (deterministic doubles, not a native client)
        run: node --experimental-loader ./tools/pickup/mock-loader.mjs --test tools/pickup/adapters.test.mjs
      - name: Audio, full package validation and package build
        run: |
          python tools/pickup/check_audio.py
          python tools/check_release.py
          python tools/build_release.py
      - name: Commit reviewed paths and remove temporary transport
        shell: python
        run: |
          import hashlib,json,os,pathlib,subprocess
          def git(*args):return subprocess.check_output(['git',*args],text=True).strip()
          root=pathlib.Path.cwd();manifest=json.loads((pathlib.Path(os.environ['RUNNER_TEMP'])/'pickup-files.json').read_text())
          # Workflows are installed/deleted by the authorized connector separately.
          paths=[name for name in manifest if not name.startswith('.github/workflows/')]
          for name in paths:
              assert hashlib.sha256((root/name).read_bytes()).hexdigest()==manifest[name],f'Test changed reviewed file: {name}'
          subprocess.run(['git','add','--',*paths],check=True)
          subprocess.run(['git','rm','--',*[f'.pickup-transfer/part{i}.b64' for i in range(4)]],check=True)
          allowed=set(paths)|{f'.pickup-transfer/part{i}.b64' for i in range(4)}
          staged=set(git('diff','--cached','--name-only').splitlines());assert staged==allowed
          branch='refs/heads/fix/pickup-parity-20260929'
          assert git('ls-remote','origin',branch).split()[0]==os.environ['GITHUB_SHA'],'Branch advanced; refusing to overwrite'
          git('config','user.name','github-actions[bot]');git('config','user.email','41898282+github-actions[bot]@users.noreply.github.com')
          subprocess.run(['git','commit','-m','fix: restore Java pickup routing and lossless native storage with regression tests'],check=True)
          subprocess.run(['git','push','origin','HEAD:'+branch],check=True)
          print('PICKUP_REPAIR_COMMIT='+git('rev-parse','HEAD'))
