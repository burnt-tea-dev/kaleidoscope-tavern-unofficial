name: Validate hanging glassware world-slot repair (temporary)
# retry after correcting the state-key test fixture
on:
  push:
    branches: [fix/glassware-world-slot-baseline-20260929]
    paths: [.github/workflows/glassware-world-slot-validate.yml]
permissions:
  contents: write
concurrency:
  group: glassware-world-slot-validate
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: tavern
          fetch-depth: 0
      - uses: actions/checkout@v4
        with:
          repository: casama233/kaleidoscope-world-liquor-unofficial
          ref: ce8c41e48c731985221945479650de121e4d477c
          path: liquor
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: KaleidoscopeMods/KaleidoscopeTavern
          ref: c4ec1880bd44cf3139d3ba744ab30bb379cf1416
          path: java
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install Pillow==11.3.0

      - name: Update only current ledger outputs; preserve immutable before hashes
        working-directory: tavern
        shell: python
        run: |
          import hashlib, json
          from pathlib import Path
          root=Path.cwd()
          path=root/'data/launch-repair-reference.json'
          data=json.loads(path.read_text())
          def sha(name):
              return hashlib.sha256((root/name).read_bytes()).hexdigest()
          row=data['reviewedChanges']['runtime/BP/blocks/glassware_holder.json']
          immutable=(row.get('before'),row.get('beforeProjected'))
          row['after']=sha('runtime/BP/blocks/glassware_holder.json')
          note=' 0.6.66 follow-up: retire the east/west state-slot compensation; facing-1/3 bone visibility now makes glass_slot_N render in Java world quadrant N.'
          if note not in row['reason']:
              row['reason']+=note
          assert immutable==(row.get('before'),row.get('beforeProjected'))
          data['newRuntimeFiles']['runtime/BP/scripts/core/hit-basis.js']=sha('runtime/BP/scripts/core/hit-basis.js')
          path.write_text(json.dumps(data,ensure_ascii=False,indent=2)+'\n')
          print(json.dumps({'glassware_holder':row['after'],'hit_basis':data['newRuntimeFiles']['runtime/BP/scripts/core/hit-basis.js']},indent=2))

      - name: Counterfactual proof — latest main fails both halves independently
        working-directory: tavern
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ../evidence
          BASE=4a93db6b5ff82cdeeeedf07a389ce280c1f25054

          python tools/check_glassware_slots.py --report ../evidence/fixed-holder-assets.json

          git show "$BASE:runtime/BP/blocks/glassware_holder.json" > "$RUNNER_TEMP/old-holder.json"
          set +e
          python tools/check_glassware_slots.py --block "$RUNNER_TEMP/old-holder.json" --report ../evidence/old-holder-assets.json > ../evidence/old-holder-assets.log 2>&1
          old_asset_status=$?
          set -e
          test "$old_asset_status" -ne 0

          cp runtime/BP/scripts/core/hit-basis.js "$RUNNER_TEMP/fixed-hit-basis.js"
          git show "$BASE:runtime/BP/scripts/core/hit-basis.js" > runtime/BP/scripts/core/hit-basis.js
          set +e
          LIQUOR_SOURCE=../liquor node --experimental-loader ./tools/pickup/mock-loader.mjs --test --test-name-pattern='glassware holder world slot round trip' tools/glassware/storage-routing.test.mjs > ../evidence/old-script-compensation.tap 2>&1
          old_script_status=$?
          set -e
          cp "$RUNNER_TEMP/fixed-hit-basis.js" runtime/BP/scripts/core/hit-basis.js
          test "$old_script_status" -ne 0

          python - <<'PY'
          import json,re
          from pathlib import Path
          tap=Path('../evidence/old-script-compensation.tap').read_text()
          m={k:int(re.search(r'^# '+k+r' (\d+)$',tap,re.M).group(1)) for k in ('tests','pass','fail','skipped','cancelled')}
          assert m=={'tests':12,'pass':6,'fail':6,'skipped':0,'cancelled':0},m
          old=json.loads(Path('../evidence/old-holder-assets.json').read_text())
          facings={e['facing'] for e in old['errors'] if 'facing' in e}
          assert old['errors'] and facings=={1,3},facings
          out={'base':'4a93db6b5ff82cdeeeedf07a389ce280c1f25054','oldAssetErrorFacings':[1,3],'oldScript':m,'nativeClientTested':False}
          Path('../evidence/counterfactual-summary.json').write_text(json.dumps(out,indent=2)+'\n')
          print(json.dumps(out,indent=2))
          PY

      - name: Fixed holder route, storage counterfactuals and existing regressions
        working-directory: tavern
        env:
          LIQUOR_SOURCE: ${{ github.workspace }}/liquor
        shell: bash
        run: |
          set -euo pipefail
          node --test tools/glassware/hit-basis.test.mjs tools/glassware/aim-hit.test.mjs 2>&1 | tee ../evidence/glassware-pure.tap
          node --experimental-loader ./tools/pickup/mock-loader.mjs --test --test-name-pattern='glassware holder world slot round trip' tools/glassware/storage-routing.test.mjs 2>&1 | tee ../evidence/holder-route.tap
          python tools/glassware/check-storage-counterfactual.py --evidence ../evidence/storage-counterfactual
          node --experimental-loader ./tools/foundation/mock-loader.mjs --test tools/foundation/foundation.test.mjs tools/creative-pick.test.mjs tools/pr-integration.test.mjs 2>&1 | tee ../evidence/foundation.tap
          node --experimental-loader ./tools/pickup/mock-loader.mjs --test tools/pickup/core.test.mjs tools/pickup/adapters.test.mjs 2>&1 | tee ../evidence/pickup.tap
          python tools/test_pick_block.py 2>&1 | tee ../evidence/pick-block.log
          node tools/check_surface_repairs.mjs 2>&1 | tee ../evidence/surface-mapping.json

      - name: Full release, Java and immutable launch-baseline validation
        working-directory: tavern
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/original-baseline"
          git archive cedfaedf6140bae61b24afb658869b1d0e6ea1a9 | tar -x -C "$RUNNER_TEMP/original-baseline"
          python tools/check_launch.py --java-source ../java --baseline "$RUNNER_TEMP/original-baseline" 2>&1 | tee ../evidence/launch.log
          python tools/check_release.py 2>&1 | tee ../evidence/release.log
          python tools/build_release.py 2>&1 | tee ../evidence/build.log
          sha256sum dist/*.mcaddon | tee ../evidence/SHA256SUMS

      - name: Commit ledger result and remove this temporary workflow
        working-directory: tavern
        shell: python
        run: |
          import os, pathlib, subprocess
          def out(*args):
              return subprocess.check_output(['git',*args],text=True).strip()
          branch='refs/heads/fix/glassware-world-slot-baseline-20260929'
          assert out('ls-remote','origin',branch).split()[0]==os.environ['GITHUB_SHA'],'branch advanced during validation'
          subprocess.run(['git','add','--','data/launch-repair-reference.json'],check=True)
          subprocess.run(['git','rm','--','.github/workflows/glassware-world-slot-validate.yml'],check=True)
          staged=set(out('diff','--cached','--name-only').splitlines())
          assert staged=={'data/launch-repair-reference.json','.github/workflows/glassware-world-slot-validate.yml'},staged
          out('config','user.name','github-actions[bot]')
          out('config','user.email','41898282+github-actions[bot]@users.noreply.github.com')
          subprocess.run(['git','commit','-m','test: lock the glassware world-slot repair to independent BP and RP gates'],check=True)
          subprocess.run(['git','push','origin','HEAD:'+branch],check=True)
          pathlib.Path('../evidence/REPAIR_COMMIT').write_text(out('rev-parse','HEAD')+'\n')
          print('REPAIR_COMMIT='+out('rev-parse','HEAD'))

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: glassware-world-slot-root-cause-evidence
          path: evidence/
          retention-days: 14
          if-no-files-found: warn
