name: Tap carrier regression
on:
  pull_request:
    paths:
      - 'runtime/**'
      - 'tools/tap/**'
      - '.github/workflows/tap-regression.yml'
permissions:
  contents: read
jobs:
  tap-carriers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Script transactions and destruction callbacks (not BDS/client acceptance)
        run: |
          set -o pipefail
          node --experimental-vm-modules --test tools/tap/tap-regression.test.mjs 2>&1 | tee tap-regressions.tap
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tap-carrier-script-regressions
          path: tap-regressions.tap
          retention-days: 14
