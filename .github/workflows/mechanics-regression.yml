name: Barrel mechanics regression
on:
  push:
    paths:
      - runtime/BP/scripts/core/machines.js
      - runtime/BP/scripts/bedrock/machines.js
      - runtime/BP/blocks/barrel_core.json
      - tools/mechanics/**
      - .github/workflows/mechanics-regression.yml
  pull_request:
permissions:
  contents: read
jobs:
  mechanics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test the actual registered callback and ingredient rules
        run: |
          set -euo pipefail
          mkdir -p test-results
          node --experimental-vm-modules --test tools/mechanics/mechanics-regression.test.mjs | tee test-results/mechanics.tap
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: barrel-mechanics-test-results
          path: test-results/
          retention-days: 14
