name: Integrate reviewed Tavern repairs
on:
  push:
    branches: ['release/0.6.39-repairs']
    paths: ['.github/workflows/repair-apply.yml', '.github/repair-input/**']
permissions:
  contents: read
concurrency:
  group: tavern-reviewed-repair-integration
  cancel-in-progress: false
jobs:
  integrate:
    if: github.repository == 'casama233/kaleidoscope-tavern-unofficial' && github.repository_id == '1377171148' && github.ref == 'refs/heads/release/0.6.39-repairs'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install Pillow==11.3.0
      - name: Apply checksum-locked source delta
        run: |
          python - <<'PY'
          import base64, hashlib, json, lzma, re, subprocess
          from pathlib import Path
          parts=sorted(Path('.github/repair-input').glob('part-*.b64'))
          assert len(parts)==5
          raw=lzma.decompress(base64.b64decode(''.join(p.read_text().strip() for p in parts), validate=True))
          assert hashlib.sha256(raw).hexdigest()=='7008149f7bec5b898b21fa6da978cba6f3f7a8efd65535b08032efa6dfe388a1'
          delta=json.loads(raw)
          subprocess.run(['git','apply','--check','-'],input=delta['patch'].encode(),check=True)
          subprocess.run(['git','apply','-'],input=delta['patch'].encode(),check=True)
          p=Path('runtime/BP/scripts/data/cookery-guide-payload.js')
          text=p.read_text(); match=re.search(r'^const GUIDE_ITEM_NAMES=.*;$',text,re.M)
          assert match
          names=json.loads(match.group()[len('const GUIDE_ITEM_NAMES='):-1])
          for locale, changes in delta['guideNamesDelta'].items():
              names.setdefault(locale,{}).update(changes)
          line='const GUIDE_ITEM_NAMES='+json.dumps(names,ensure_ascii=False,separators=(',',':'))+';'
          p.write_text(text[:match.start()]+line+text[match.end():])
          PY
      - name: Generate and validate reviewed resources (no player simulation)
        run: |
          python tools/build_incense_emitters.py
          python tools/check_release.py
          python tools/refresh_visual_compat.py --report docs/VISUAL-MATERIAL-AUDIT-0.6.39.json
          python tools/build_release.py
          python - <<'PY'
          import hashlib
          from pathlib import Path
          p=Path('dist/Kaleidoscope_Tavern_Unofficial_0.6.39_beta1.mcaddon')
          actual=hashlib.sha256(p.read_bytes()).hexdigest()
          assert actual=='2a891f053c23582eb8fb8c0b36e67e215060d6b9a601cd2ce9fac56058853ee0',actual
          print('Exact locally reviewed full-pack bytes verified:',actual)
          PY
      - name: Commit canonical source on repair branch only
        env:
          EXPECTED_HEAD: ${{ github.sha }}
        run: |
          set -euo pipefail
          git diff --exit-code -- .github/
          test "$(git ls-remote origin refs/heads/release/0.6.39-repairs | cut -f1)" = "$EXPECTED_HEAD"
          git add runtime/ docs/ tools/ sdk/ README.md README.zh-TW.md package.json release.json
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Integrate reviewed cup recovery, incense, third-person and guide repairs for 0.6.39'
          git push origin HEAD:refs/heads/release/0.6.39-repairs
          git rev-parse HEAD > dist/INTEGRATED_SOURCE_COMMIT
          git archive --format=zip HEAD > dist/integrated-source.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Tavern-integrated-repairs
          path: dist/
          retention-days: 7
