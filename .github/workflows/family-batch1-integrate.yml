name: Integrate family compatibility batch 1
on:
  push:
    branches: ['fix/family-compat-batch1-20260929']
    paths: ['.github/workflows/family-batch1-integrate.yml']
permissions:
  contents: read
jobs:
  integrate:
    if: github.repository == 'casama233/kaleidoscope-tavern-unofficial' && github.repository_id == '1377171148'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: repo
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install Pillow==11.3.0
      - name: Reconstruct checksum-locked source (no third-party code or workflows)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import base64,hashlib,json,lzma,os,subprocess
          from pathlib import Path,PurePosixPath
          parts=[]
          for sha in ['5df7a3fdf45395c0415861cccb8e96a52259ea08','2ed1641ee84bd8ce10d8a021319e58ff57ee39e4','42ebb9567f0e1c427da4ce26b988601361fedde8']:
              blob=json.loads(subprocess.check_output(['gh','api','repos/casama233/kaleidoscope-tavern-unofficial/git/blobs/'+sha]))
              assert blob['sha']==sha and blob['encoding']=='base64'
              parts.append(base64.b64decode(''.join(blob['content'].split()),validate=True))
          raw=lzma.decompress(b''.join(parts))
          assert hashlib.sha256(raw).hexdigest()=='d73d5c5458627a13067610403c712c685fa6c18eb1a0f90225b7503cfa9645c5'
          row=json.loads(raw)[os.environ['GITHUB_REPOSITORY']];root=Path('repo');names=[]
          for change in row['changes']:
              name=change['path'];p=root/name;path=PurePosixPath(name)
              assert not path.is_absolute() and '..' not in path.parts and name not in names
              assert path.parts[0] in ['README.md','package.json','release.json','runtime','tools','data','docs','compat']
              assert not p.is_symlink()
              if change['before'] is None:assert not p.exists();old=b''
              else:old=p.read_bytes();assert hashlib.sha256(old).hexdigest()==change['before'],name
              text=old.decode('utf-8');previous=0
              for start,end,replacement in change['edits']:
                  assert previous<=start<=end<=len(text);previous=end
              for start,end,replacement in reversed(change['edits']):text=text[:start]+replacement+text[end:]
              new=text.encode('utf-8');assert hashlib.sha256(new).hexdigest()==change['after'],name
              p.parent.mkdir(parents=True,exist_ok=True);p.write_bytes(new);names.append(name)
          Path('reviewed-row.json').write_text(json.dumps(row))
          print('Verified reviewed files:',len(names))
          PY
      - name: Static source/resource checks and complete candidate archive
        working-directory: repo
        run: |
          python tools/check_release.py
          python tools/family_candidate.py --build
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          row=json.loads(Path('../reviewed-row.json').read_text());p=Path('dist/family')/row['archive']
          assert hashlib.sha256(p.read_bytes()).hexdigest()==row['archiveSha256']
          for change in row['changes']:assert hashlib.sha256(Path(change['path']).read_bytes()).hexdigest()==change['after'],change['path']
          PY
      - name: Commit exact reviewed source on candidate branch only
        working-directory: repo
        env:
          EXPECTED_HEAD: ${{ github.sha }}
        run: |
          set -euo pipefail
          git diff --exit-code -- .github/
          test "$(git ls-remote origin refs/heads/fix/family-compat-batch1-20260929 | cut -f1)" = "$EXPECTED_HEAD"
          python - <<'PY'
          import json,subprocess
          from pathlib import Path
          names=[r['path'] for r in json.loads(Path('../reviewed-row.json').read_text())['changes']]
          subprocess.run(['git','add','--',*names],check=True)
          PY
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'compat: first public Cookery 1.0.8 candidate and optional Deco ladder recipe adapter'
          git push origin HEAD:refs/heads/fix/family-compat-batch1-20260929
          git rev-parse HEAD > dist/family/SOURCE_COMMIT
          cp docs/FAMILY-COMPAT-BATCH1.md dist/family/
          git archive --format=zip HEAD > dist/family/reviewed-source.zip
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: family-batch1-integrated-tavern
          path: repo/dist/family/
          retention-days: 14
