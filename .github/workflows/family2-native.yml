name: Family2 native compatibility checks
on:
  push:
    branches: ['fix/family-compat-batch2-20260929']
    paths: ['tools/family_batch2_native.py', 'tools/build_family_vendor_patches.py', 'tools/fixtures/family2/**', 'compat/family/**', 'runtime/**', '.github/workflows/family2-native.yml']
  pull_request:
    paths: ['tools/family_batch2_native.py', 'tools/build_family_vendor_patches.py', 'tools/fixtures/family2/**', 'compat/family/**', 'runtime/**', '.github/workflows/family2-native.yml']
permissions:
  contents: read
concurrency:
  group: family2-native-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native:
    if: github.repository == 'casama233/kaleidoscope-tavern-unofficial' && github.repository_id == '1377171148'
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
        with:
          path: tavern-src
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: casama233/kaleidoscope-grilling-unofficial
          ref: b9814614edd8a8fa7fa14afc63f3e626fa7ea6da
          path: grilling-src
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: casama233/kaleidoscope-grilling-unofficial
          ref: 1ed332a5410e28290c80cc27cb971658864733ef
          path: grilling-baseline
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: casama233/kaleidoscope-world-liquor-unofficial
          ref: c7cb20428c8407c5d1ca2e7d9251303616fd4027
          path: world-liquor-src
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build exact committed candidates; no simulated player tests
        run: |
          python -m py_compile tavern-src/tools/build_family_vendor_patches.py tavern-src/tools/family_batch2_native.py
          python tavern-src/tools/family_candidate.py --build
          python world-liquor-src/tools/family_candidate.py --build
          python grilling-src/tools/apply_family_profile.py
          git -C grilling-src diff --exit-code -- projects/grilling/gameplay_core/
          python grilling-src/tools/check_station_storage.py
          (cd grilling-src && node tools/check_family_knives.mjs)
          python grilling-src/tools/family_candidate.py --build
          python tavern-src/tools/build_deco_compat.py
          python - <<'PY'
          import hashlib
          from pathlib import Path
          expected={
            'tavern-src/dist/family/Kaleidoscope_Tavern_Unofficial_0.6.64_compat1.mcaddon':'d46e95299071763bb34bc79eeb5062430671af1400c37cf2268c9168f95f0387',
            'world-liquor-src/dist/family/Kaleidoscope_World_Liquor_Unofficial_0.1.28_compat1.mcaddon':'419c73afa6309df8d8e6307ff240bb05592f6d7f6ec727867aac305c20ad8cac',
            'grilling-src/dist/family/Kaleidoscope_Grilling_A2.8.9_compat2.mcaddon':'15ebdf47397c397fa9c39584f6fcbb57ca5be2ad4c16513d979c737d06c5952a'}
          for name,digest in expected.items():assert hashlib.sha256(Path(name).read_bytes()).hexdigest()==digest,name
          PY
      - name: Native nine-pack control, patched stack and same-world restart
        run: python tavern-src/tools/family_batch2_native.py --liquor-root world-liquor-src --grilling-root grilling-src --grilling-baseline grilling-baseline --work "$RUNNER_TEMP/family2-native"
      - name: Collect only owned packages, receipts and logs; never vendor scripts or worlds
        if: always()
        run: |
          python - <<'PY'
          import hashlib,json,os,shutil,subprocess
          from pathlib import Path
          out=Path('review');out.mkdir()
          evidence=Path(os.environ['RUNNER_TEMP'])/'family2-native/evidence'
          if evidence.exists():shutil.copytree(evidence,out/'native-evidence')
          for repo in ['tavern-src','grilling-src','world-liquor-src']:
              src=Path(repo)/'dist/family'
              if src.exists():shutil.copytree(src,out/repo)
          sources={repo:subprocess.check_output(['git','-C',repo,'rev-parse','HEAD'],text=True).strip() for repo in ['tavern-src','grilling-src','grilling-baseline','world-liquor-src']}
          (out/'SOURCE-COMMITS.json').write_text(json.dumps(sources,indent=2)+'\n')
          tools=Path('tavern-src/tools')
          names=['build_family_vendor_patches.py','family_batch2_native.py','fixtures/family2/storage-native-probe.js','fixtures/family2/cookery-native-probe.js','fixtures/family2/immersive-native-probe.js']
          (out/'TOOL-HASHES.json').write_text(json.dumps({n:hashlib.sha256((tools/n).read_bytes()).hexdigest() for n in names},indent=2)+'\n')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Family2-native-compatibility-evidence
          path: review/
          retention-days: 14
