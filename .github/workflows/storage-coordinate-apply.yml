name: Validate storage coordinate repair (temporary)
on:
  push:
    branches: [fix/storage-hit-render-20260929]
    paths: [.github/workflows/storage-coordinate-apply.yml]
permissions:
  contents: write
concurrency:
  group: storage-coordinate-apply
  cancel-in-progress: false
jobs:
  repair:
    if: github.repository == 'casama233/kaleidoscope-tavern-unofficial' && github.ref == 'refs/heads/fix/storage-hit-render-20260929'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          path: tavern
      - uses: actions/checkout@v4
        with:
          repository: casama233/kaleidoscope-world-liquor-unofficial
          ref: ce8c41e48c731985221945479650de121e4d477c
          path: liquor
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: KaleidoscopeMods/KaleidoscopeTavern
          ref: c4ec1880bd44cf3139d3ba744ab30bb379cf1416
          path: java
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install Pillow==11.3.0
      - name: Apply checksum-locked reviewed changes only
        working-directory: tavern
        shell: python
        run: |
          import base64,hashlib,json,lzma,pathlib,subprocess,os
          root=pathlib.Path.cwd()
          encoded=''.join((root/f'.storage-coordinate-transfer/part{i}.b64').read_text().strip() for i in range(2))
          packed=base64.b64decode(encoded,validate=True)
          assert hashlib.sha256(packed).hexdigest()=='a8f18ef49da0bff7701db1555c2f5b6f9b283ab60ea9aeee6cf0c77f3444aedd'
          bundle=json.loads(lzma.decompress(packed));assert bundle['base']=='8add56c2bb8a9d5a6de18dee176cdf88bf87b08b'
          subprocess.run(['git','merge-base','--is-ancestor',bundle['base'],'HEAD'],check=True)
          allowed={'data/launch-repair-reference.json','docs/HANDOFF-20260929.md','docs/STORAGE-AIM-ROOT-CAUSE-20260929.md','runtime/BP/scripts/bedrock/stateful-storage-router.js','runtime/BP/scripts/core/aim-hit.js','tools/glassware/aim-hit.test.mjs','tools/glassware/storage-routing.test.mjs','tools/glassware/check-storage-counterfactual.py','tools/glassware/replay-storage-touch.mjs'}
          assert set(bundle['changes'])==allowed
          before_ledger=json.loads((root/'data/launch-repair-reference.json').read_text())
          for name,row in bundle['changes'].items():
              path=root/name
              if row['before'] is None:
                  assert not path.exists(),name
                  raw=row['content'].encode('utf-8')
              else:
                  original=path.read_bytes();assert hashlib.sha256(original).hexdigest()==row['before'],name
                  lines=original.decode('utf-8').splitlines(keepends=True)
                  for start,end,text in reversed(row['ops']):
                      assert 0<=start<=end<=len(lines)
                      lines[start:end]=[text]
                  raw=''.join(lines).encode('utf-8')
              assert hashlib.sha256(raw).hexdigest()==row['after'],name
              path.parent.mkdir(parents=True,exist_ok=True);path.write_bytes(raw)
          after_ledger=json.loads((root/'data/launch-repair-reference.json').read_text())
          for name,row in before_ledger['reviewedChanges'].items():
              for key in ('before','beforeProjected'):assert row.get(key)==after_ledger['reviewedChanges'][name].get(key),(name,key)
          (pathlib.Path(os.environ['RUNNER_TEMP'])/'storage-coordinate-bundle.json').write_text(json.dumps(bundle))
          print('Verified all 9 reviewed files; immutable before hashes retained')
      - name: Reproduce old failure, partial-fix failure, and fixed actual consumers
        working-directory: tavern
        env:
          LIQUOR_SOURCE: ${{ github.workspace }}/liquor
        run: |
          set -euo pipefail
          mkdir -p ../evidence
          python tools/glassware/check-storage-counterfactual.py --evidence ../evidence/counterfactual
          node --test tools/glassware/hit-basis.test.mjs tools/glassware/aim-hit.test.mjs 2>&1 | tee ../evidence/geometry.tap
          node tools/check_surface_repairs.mjs | tee ../evidence/surface-mapping.json
      - name: Preserve all existing inventory and companion regressions
        working-directory: tavern
        env:
          LIQUOR_SOURCE: ${{ github.workspace }}/liquor
        run: |
          set -euo pipefail
          node --experimental-loader ./tools/foundation/mock-loader.mjs --test tools/foundation/foundation.test.mjs tools/creative-pick.test.mjs tools/pr-integration.test.mjs 2>&1 | tee ../evidence/foundation.tap
          python tools/test_pick_block.py 2>&1 | tee ../evidence/pick-block.log
          node --experimental-loader ./tools/pickup/mock-loader.mjs --test tools/pickup/core.test.mjs tools/pickup/adapters.test.mjs 2>&1 | tee ../evidence/pickup.tap
      - name: Full static checks, immutable launch baseline and test build
        working-directory: tavern
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/storage-original-baseline"
          git archive cedfaedf6140bae61b24afb658869b1d0e6ea1a9 | tar -x -C "$RUNNER_TEMP/storage-original-baseline"
          python tools/check_launch.py --java-source ../java --baseline "$RUNNER_TEMP/storage-original-baseline" 2>&1 | tee ../evidence/launch.log
          python tools/check_release.py 2>&1 | tee ../evidence/release.log
          python tools/build_release.py 2>&1 | tee ../evidence/build.log
          sha256sum dist/*.mcaddon | tee ../evidence/SHA256SUMS
      - name: Commit only verified paths; refuse concurrent branch changes
        working-directory: tavern
        shell: python
        run: |
          import hashlib,json,pathlib,subprocess,os
          def git(*args):return subprocess.check_output(['git',*args],text=True).strip()
          root=pathlib.Path.cwd();bundle=json.loads((pathlib.Path(os.environ['RUNNER_TEMP'])/'storage-coordinate-bundle.json').read_text());paths=list(bundle['changes'])
          for name,row in bundle['changes'].items():assert hashlib.sha256((root/name).read_bytes()).hexdigest()==row['after'],('Tests mutated reviewed source',name)
          branch='refs/heads/fix/storage-hit-render-20260929'
          assert git('ls-remote','origin',branch).split()[0]==os.environ['GITHUB_SHA'],'Branch advanced; refusing overwrite'
          subprocess.run(['git','add','--',*paths],check=True)
          transport=[f'.storage-coordinate-transfer/part{i}.b64' for i in range(2)]
          subprocess.run(['git','rm','--',*transport],check=True)
          assert set(git('diff','--cached','--name-only').splitlines())==set(paths)|set(transport)
          git('config','user.name','github-actions[bot]');git('config','user.email','41898282+github-actions[bot]@users.noreply.github.com')
          subprocess.run(['git','commit','-m','fix: preserve touch aim through actual slot consumers and rotate inset selection boxes'],check=True)
          subprocess.run(['git','push','origin','HEAD:'+branch],check=True)
          (root.parent/'evidence/REPAIR_COMMIT').write_text(git('rev-parse','HEAD')+'\n')
          print('REPAIR_COMMIT='+git('rev-parse','HEAD'))
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: storage-coordinate-root-cause-evidence
          path: evidence/
          retention-days: 14
