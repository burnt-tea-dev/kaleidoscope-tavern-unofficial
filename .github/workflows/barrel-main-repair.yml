name: Isolated barrel mechanics repair
on:
  push:
    branches: [fix/barrel-mechanics-20260929]
    paths:
      - .github/workflows/barrel-main-repair.yml
      - tools/mechanics/repair_current_main.py
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply only the two audited callback edits
        run: python tools/mechanics/repair_current_main.py
      - name: Validate actual registered callback and ordinary inputs
        run: |
          set -euo pipefail
          mkdir -p /tmp/barrel-evidence
          node --experimental-vm-modules --test tools/mechanics/mechanics-regression.test.mjs | tee /tmp/barrel-evidence/mechanics.tap
          node --check runtime/BP/scripts/bedrock/machines.js
          node --check runtime/BP/scripts/core/machines.js
      - name: Commit reviewed source without touching main
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = 'fix/barrel-mechanics-20260929'
          test "$(git ls-remote origin "refs/heads/$GITHUB_REF_NAME" | cut -f1)" = "$GITHUB_SHA"
          git add runtime/BP/scripts/core/machines.js runtime/BP/scripts/bedrock/machines.js data/launch-repair-reference.json data/mechanics-repair-20260929.json
          git diff --cached --check
          git config user.name 'Kaleidoscope Tavern Unofficial'
          git config user.email '97009482+casama233@users.noreply.github.com'
          git commit -m 'fix(mechanics): complete isolated 97 tick barrel repair with original audit baseline intact'
          git push origin "HEAD:refs/heads/$GITHUB_REF_NAME"
          git log -1 --format='%H%n%B' > /tmp/barrel-evidence/commit.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: isolated-barrel-regression
          path: /tmp/barrel-evidence/
          retention-days: 7
