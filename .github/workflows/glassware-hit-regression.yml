name: Glassware hit regression
on:
  pull_request:
    paths:
      - 'runtime/**'
      - 'tools/glassware/**'
      - 'tools/foundation/**'
      - 'tools/pickup/**'
      - '.github/workflows/glassware-hit-regression.yml'
permissions:
  contents: read
jobs:
  glassware-hit-basis:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          path: tavern
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: casama233/kaleidoscope-world-liquor-unofficial
          ref: 8a70ecdf2ece9d5f9d9717ad8919ec25f0a2c04c
          path: liquor
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Hit geometry and display mapping (not BDS/client acceptance)
        working-directory: tavern
        run: |
          set -euo pipefail
          mkdir -p ../evidence
          git rev-parse HEAD > ../evidence/TAVERN_COMMIT
          git -C ../liquor rev-parse HEAD > ../evidence/LIQUOR_COMMIT
          node --test tools/glassware/hit-basis.test.mjs tools/glassware/aim-hit.test.mjs tools/glassware/block-hit.test.mjs 2>&1 | tee ../evidence/glassware-hit-regressions.tap
          python tools/check_glassware_slots.py --report ../evidence/glassware-world-slots.json
          LIQUOR_SOURCE=../liquor node --experimental-loader ./tools/pickup/mock-loader.mjs --test --test-name-pattern='glassware holder world slot round trip' tools/glassware/storage-routing.test.mjs 2>&1 | tee ../evidence/glassware-holder-routing.tap
          node tools/check_surface_repairs.mjs | tee ../evidence/surface-mapping.json
      - name: Event-to-inventory counterexamples and complete canonical fix
        working-directory: tavern
        env:
          LIQUOR_SOURCE: ${{ github.workspace }}/liquor
        run: |
          set -euo pipefail
          python tools/glassware/check-storage-counterfactual.py --evidence ../evidence/counterfactual
          git diff --exit-code -- runtime/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: glassware-hit-script-regressions
          path: evidence/
          retention-days: 14
