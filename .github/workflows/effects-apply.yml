name: Apply verified effects patch
on:
  push:
    branches: ['fix/effects-parity-20260928']
    paths: ['.github/workflows/effects-apply.yml']
permissions:
  contents: read
jobs:
  apply:
    if: github.repository == 'casama233/kaleidoscope-tavern-unofficial' && github.ref == 'refs/heads/fix/effects-parity-20260928'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/effects-parity-20260928
          path: bedrock
      - uses: actions/checkout@v4
        with:
          repository: KaleidoscopeMods/KaleidoscopeTavern
          ref: c4ec1880bd44cf3139d3ba744ab30bb379cf1416
          path: java
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install Pillow==11.3.0
      - name: Verify and apply exact local-tested source patch
        working-directory: bedrock
        run: |
          python - <<'PY'
          import base64,hashlib,lzma,subprocess
          from pathlib import Path
          encoded=''.join(Path(f'tools/effects/transfer.part{i}').read_text().strip() for i in range(1,4))
          data=lzma.decompress(base64.b64decode(encoded,validate=True))
          assert hashlib.sha256(data).hexdigest()=='0cc4dfdf612eb2ff5b3f8582c98ba3c610dd630d93e4a7acac59f840acd0880e'
          for line in data.decode().splitlines():
              if line.startswith('+++ b/'):
                  path=line[6:]
                  assert path.startswith(('runtime/','tools/','docs/')) and '..' not in Path(path).parts,path
          patch=Path('../verified-effects.patch');patch.write_bytes(data)
          subprocess.run(['git','apply','--check',str(patch)],check=True)
          subprocess.run(['git','apply',str(patch)],check=True)
          PY
      - name: Generate hash-verified particle and sound resources
        working-directory: bedrock
        run: |
          python tools/effects/collect_reference.py "$RUNNER_TEMP/vanilla-reference"
          python tools/effects/build_feedback_particles.py --reference "$RUNNER_TEMP/vanilla-reference"
          python tools/effects/build_feedback_sounds.py "$RUNNER_TEMP/vanilla-reference"
          python tools/build_incense_emitters.py
          python tools/effects/index_sources.py ../java
      - name: Run 72 unique specialist regressions and parse checks
        working-directory: bedrock
        run: |
          set -o pipefail
          node --experimental-vm-modules --test tools/effects/effects-regression.test.mjs | tee ../effects-tests.tap
          python - <<'PY'
          import json,subprocess
          from pathlib import Path
          for p in Path('runtime').rglob('*.json'):json.loads(p.read_text())
          for p in Path('runtime/BP/scripts').rglob('*.js'):subprocess.run(['node','--check',str(p)],check=True)
          PY
      - name: Commit only reviewed source, generated resources and audit documents
        working-directory: bedrock
        run: |
          find tools -type d -name __pycache__ -prune -exec rm -rf '{}' +
          git add runtime docs tools/build_incense_emitters.py tools/effects
          git diff --cached --stat
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: restore source-backed effects and incense dynamics; document remaining parity gaps'
          git push origin HEAD:refs/heads/fix/effects-parity-20260928
          git rev-parse HEAD > ../APPLIED_COMMIT.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: effects-applied-evidence
          path: |
            effects-tests.tap
            APPLIED_COMMIT.txt
            bedrock/docs/EFFECTS-PARITY-AUDIT-20260928.md
          retention-days: 14
