name: Validate shared pickup follow-up (temporary)
on:
  push:
    branches: [fix/pickup-parity-20260929]
    paths: [.github/workflows/pickup-followup.yml]
permissions:
  contents: write
concurrency:
  group: pickup-repair-followup
  cancel-in-progress: false
jobs:
  repair:
    if: github.repository == 'casama233/kaleidoscope-tavern-unofficial' && github.ref == 'refs/heads/fix/pickup-parity-20260929'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: tavern
          fetch-depth: 0
      - uses: actions/checkout@v4
        with:
          repository: casama233/kaleidoscope-world-liquor-unofficial
          ref: ce8c41e48c731985221945479650de121e4d477c
          path: liquor
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install Pillow==11.3.0
      - name: Apply only checksum-reviewed changes
        working-directory: tavern
        shell: python
        run: |
          import hashlib,json,pathlib,subprocess
          root=pathlib.Path.cwd();raw=(root/'.pickup-followup.json').read_bytes()
          assert hashlib.sha256(raw).hexdigest()=='faba835e1c4d520f8406acc102d0d80887427549cf076b4080227d8400b1e05e'
          bundle=json.loads(raw);assert bundle['base']=='619715eb5779a77a153473783027ffcf1c845a67'
          subprocess.run(['git','merge-base','--is-ancestor',bundle['base'],'HEAD'],check=True)
          for name,row in bundle['files'].items():
              p=pathlib.PurePosixPath(name);assert not p.is_absolute() and '..' not in p.parts and p.parts[0] in {'runtime','tools','docs','data'}
              path=root/name;before=path.read_bytes();assert hashlib.sha256(before).hexdigest()==row['before'],name
              lines=before.decode('utf-8').splitlines(keepends=True)
              for start,end,text in reversed(row['ops']):
                  assert 0<=start<=end<=len(lines);lines[start:end]=[text]
              after=''.join(lines).encode('utf-8');assert hashlib.sha256(after).hexdigest()==row['after'],name
              path.write_bytes(after)
          print('Verified all 9 reviewed files')
      - name: Pure, adapter and all existing cross-pack regressions
        working-directory: tavern
        env:
          LIQUOR_SOURCE: ${{ github.workspace }}/liquor
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ../evidence
          node --test tools/pickup/core.test.mjs tools/glassware/hit-basis.test.mjs 2>&1 | tee ../evidence/pure.tap
          node --experimental-loader ./tools/pickup/mock-loader.mjs --test tools/pickup/adapters.test.mjs 2>&1 | tee ../evidence/adapters.tap
          node --experimental-loader ./tools/foundation/mock-loader.mjs --test tools/foundation/foundation.test.mjs tools/creative-pick.test.mjs tools/pr-integration.test.mjs 2>&1 | tee ../evidence/foundation.tap
          python tools/test_pick_block.py 2>&1 | tee ../evidence/pick-block.log
          python tools/creative/test_catalog.py 2>&1 | tee ../evidence/creative.log
          python ../liquor/tools/build_effect_names.py --check
          node --test tools/effect-bar.test.mjs 2>&1 | tee ../evidence/effects.tap
      - name: Retain original audit baseline, check and build package
        working-directory: tavern
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/pickup-original-baseline"
          git archive cedfaedf6140bae61b24afb658869b1d0e6ea1a9 | tar -x -C "$RUNNER_TEMP/pickup-original-baseline"
          python tools/pickup/check_audio.py 2>&1 | tee ../evidence/audio.log
          python tools/check_release.py 2>&1 | tee ../evidence/release.log
          python tools/check_launch.py --baseline "$RUNNER_TEMP/pickup-original-baseline" 2>&1 | tee ../evidence/launch.log
          python tools/build_release.py 2>&1 | tee ../evidence/build.log
      - name: Commit only reviewed files; refuse concurrent branch changes
        working-directory: tavern
        shell: python
        run: |
          import hashlib,json,os,pathlib,subprocess
          def git(*args):return subprocess.check_output(['git',*args],text=True).strip()
          root=pathlib.Path.cwd();bundle=json.loads((root/'.pickup-followup.json').read_text());paths=list(bundle['files'])
          for name,row in bundle['files'].items():assert hashlib.sha256((root/name).read_bytes()).hexdigest()==row['after'],name
          branch='refs/heads/fix/pickup-parity-20260929';assert git('ls-remote','origin',branch).split()[0]==os.environ['GITHUB_SHA'],'Branch advanced'
          subprocess.run(['git','add','--',*paths],check=True);subprocess.run(['git','rm','--','.pickup-followup.json'],check=True)
          assert set(git('diff','--cached','--name-only').splitlines())==set(paths)|{'.pickup-followup.json'}
          git('config','user.name','github-actions[bot]');git('config','user.email','41898282+github-actions[bot]@users.noreply.github.com')
          subprocess.run(['git','commit','-m','fix: route registered cabinets through native main-hand storage and align stable API fixtures'],check=True)
          subprocess.run(['git','push','origin','HEAD:'+branch],check=True)
          print('PICKUP_FOLLOWUP_COMMIT='+git('rev-parse','HEAD'))
      - name: Preserve inspected integration source without fonts
        if: always()
        shell: bash
        run: |
          mkdir -p evidence
          tar --exclude='*.ttf' --exclude='*.otf' --exclude='*.woff*' --exclude='.git' -cJf evidence/liquor-pinned-source.tar.xz liquor
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pickup-followup-evidence
          path: evidence/
          retention-days: 3
