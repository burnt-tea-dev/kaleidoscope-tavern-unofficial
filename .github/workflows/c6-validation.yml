name: Release package checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install image validation dependency
        run: python -m pip install Pillow==11.3.0
      - name: Static resources, scripts, guide and visual regression checks
        run: python tools/check_release.py
      - name: Ensure validation did not rewrite packaged source
        run: git diff --exit-code -- runtime/
      - name: Build public test package
        run: python tools/build_release.py
      - name: Include source revision and validation evidence
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          printf '%s\n' "$SOURCE_SHA" > dist/SOURCE_COMMIT
          cp docs/VALIDATION-0.6.38-VISUAL.json docs/VISUAL-MATERIAL-AUDIT-0.6.38.json dist/
      - uses: actions/upload-artifact@v4
        with:
          name: Tavern-public-beta
          path: dist/
