name: Release package checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: KaleidoscopeMods/KaleidoscopeTavern
          ref: c4ec1880bd44cf3139d3ba744ab30bb379cf1416
          path: .source-check/java
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: casama233/kaleidoscope-tavern-unofficial
          ref: cedfaedf6140bae61b24afb658869b1d0e6ea1a9
          path: .source-check/integration-baseline
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install image validation dependency
        run: python -m pip install Pillow==11.3.0
      - name: Static resources, scripts, guide and visual regression checks
        run: python tools/check_release.py
      - name: Ensure validation did not rewrite packaged source
        run: git diff --exit-code -- runtime/
      - name: Verify original Java source matrices and reproducible storage geometry
        run: |
          python tools/build_storage_visuals.py
          git diff --exit-code -- runtime/
          version="$(python -c 'import json; print(json.load(open("release.json"))["version"])')"
          python tools/check_storage_rendering.py --java-source .source-check/java --report "docs/STORAGE-VALIDATION-${version}.json"
      - name: Audit all runtime changes against pinned main and Java
        run: python tools/check_launch.py --java-source .source-check/java --baseline .source-check/integration-baseline
      - name: Build public test package
        run: python tools/build_release.py
      - name: Include matching source revision and validation evidence
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          python - <<'PY'
          import json,os,shutil
          from pathlib import Path
          version=json.loads(Path('release.json').read_text())['version']
          if isinstance(version,list):version='.'.join(map(str,version))
          Path('dist/SOURCE_COMMIT').write_text(os.environ['SOURCE_SHA']+'\n')
          for name in (f'VALIDATION-{version}-VISUAL.json',f'VISUAL-MATERIAL-AUDIT-{version}.json',f'REPAIR-STATIC-{version}.json',f'STORAGE-VALIDATION-{version}.json',f'MOTION-STATIC-{version}.json',f'LAUNCH-VALIDATION-{version}.json'):
              path=Path('docs')/name
              if path.exists():shutil.copy2(path,Path('dist')/name)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: Tavern-public-beta
          path: dist/

  deliver-break-feedback-audit-ledger:
    if: github.ref == 'refs/heads/fix/break-feedback-full-20260929'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Extend immutable runtime audit ledger for reviewed destruction feedback
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json,subprocess
          from pathlib import Path
          ROOT=Path('.'); BASE='f793a98a0180e1948f98e69a8ca879a028884e38'
          launch=json.loads(Path('data/launch-repair-reference.json').read_text())
          old_changes=launch['reviewedChanges']; old_add=launch['newRuntimeFiles']
          def sha(data):return hashlib.sha256(data).hexdigest()
          def base_bytes(path):return subprocess.check_output(['git','show',BASE+':'+path])
          names=subprocess.check_output(['git','diff','--name-status',BASE+'...HEAD','--','runtime/'],text=True).splitlines()
          changes={};updated={};additions={}
          for line in names:
            status,path=line.split('\t',1)
            current=Path(path).read_bytes()
            if status=='A':
              try:base_bytes(path);raise AssertionError(('Addition existed in base',path))
              except subprocess.CalledProcessError:pass
              additions[path]=sha(current);continue
            assert status=='M',('Unexpected runtime mutation',status,path)
            before=sha(base_bytes(path));after=sha(current)
            if path in old_add:
              assert old_add[path]==before,('Reviewed addition chain mismatch',path,old_add[path],before)
              updated[path]={'before':before,'after':after};continue
            if path in old_changes:
              assert old_changes[path]['after']==before,('Reviewed change chain mismatch',path,old_changes[path]['after'],before)
              changes[path]={'before':before,'after':after,'reason':'2026-09-29 reviewed destruction-feedback repair; transaction-scoped particles/audio only.'};continue
            assert '/blocks/' not in path and '/items/' not in path,('Projected metadata needs explicit review',path)
            changes[path]={'before':before,'beforeProjected':before,'after':after,'reason':'2026-09-29 reviewed destruction-feedback repair; non-menu runtime source.'}
          review={'baseCommit':BASE,'changes':dict(sorted(changes.items())),'updatedAdditions':dict(sorted(updated.items())),'additions':dict(sorted(additions.items()))}
          Path('data/break-feedback-review.json').write_text(json.dumps(review,indent=2)+'\n')
          p=Path('tools/reviewed_changes.py');s=p.read_text()
          needle="ROOT=Path(__file__).resolve().parents[1]\n"
          inject="""ROOT=Path(__file__).resolve().parents[1]\n@lru_cache(maxsize=1)\ndef break_review():\n    return json.loads((ROOT/'data/break-feedback-review.json').read_text())\n"""
          assert needle in s and 'def break_review()' not in s;s=s.replace(needle,inject,1)
          old="""@lru_cache(maxsize=1)\ndef changes():\n    return json.loads((ROOT/'data/launch-repair-reference.json').read_text())['reviewedChanges']\n"""
          new="""@lru_cache(maxsize=1)\ndef changes():\n    rows=dict(json.loads((ROOT/'data/launch-repair-reference.json').read_text())['reviewedChanges'])\n    for name,change in break_review()['changes'].items():\n        prior=rows.get(name)\n        if prior:\n            assert prior['after']==change['before'],('Break-feedback change chain mismatch',name)\n            rows[name]={**prior,'after':change['after'],'reason':prior.get('reason','')+' '+change['reason']}\n        else:\n            rows[name]={'before':change['before'],'beforeProjected':change.get('beforeProjected',change['before']),'after':change['after'],'reason':change['reason']}\n    return rows\n"""
          assert old in s;s=s.replace(old,new,1)
          start=s.index("@lru_cache(maxsize=1)\ndef reviewed_additions():")
          end=s.index("\n@lru_cache(maxsize=1)\ndef reviewed_removals():",start)
          oldblock=s[start:end]
          newblock="""@lru_cache(maxsize=1)\ndef reviewed_additions():\n    rows=dict(json.loads((ROOT/'data/launch-repair-reference.json').read_text())['newRuntimeFiles'])\n    review=break_review()\n    for name,change in review['updatedAdditions'].items():\n        assert rows.get(name)==change['before'],('Break-feedback addition chain mismatch',name)\n        rows[name]=change['after']\n    for name,digest in review['additions'].items():\n        assert name not in rows and name not in changes(),('Break-feedback addition already tracked',name)\n        rows[name]=digest\n    for name,digest in rows.items():assert hashlib.sha256((ROOT/name).read_bytes()).hexdigest()==digest,('Reviewed addition changed',name)\n    return rows\n"""
          s=s[:start]+newblock+s[end:]
          p.write_text(s)
          print(json.dumps({'changes':len(changes),'updatedAdditions':len(updated),'additions':len(additions)}))
          PY
          python tools/check_storage_rendering.py
          git show f793a98a0180e1948f98e69a8ca879a028884e38:.github/workflows/c6-validation.yml > .github/workflows/c6-validation.yml
          git add data/break-feedback-review.json tools/reviewed_changes.py .github/workflows/c6-validation.yml
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'audit: chain destruction feedback through preserved runtime hashes'
          git push origin HEAD:fix/break-feedback-full-20260929

