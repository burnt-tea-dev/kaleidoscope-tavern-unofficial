name: Release package checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Static resources, scripts and guide catalog
        run: python tools/check_release.py
      - name: Build release candidate
        run: python tools/build_release.py
      - uses: actions/upload-artifact@v4
        with:
          name: Tavern-release-candidate
          path: dist/
