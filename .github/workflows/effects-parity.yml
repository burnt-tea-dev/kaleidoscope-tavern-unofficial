name: Effects parity audit
on:
  push:
    branches: ['fix/effects-parity-20260928', 'fix/effects-report-followup-20260928']
    paths: ['.github/workflows/effects-parity.yml', 'tools/effects/**', 'runtime/**']
  pull_request:
    paths: ['.github/workflows/effects-parity.yml', 'tools/effects/**', 'runtime/**']
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          path: bedrock
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: KaleidoscopeMods/KaleidoscopeTavern
          ref: c4ec1880bd44cf3139d3ba744ab30bb379cf1416
          path: java
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: Mojang/bedrock-samples
          ref: 46ba6ea985fb5a92d79a9419198f10dda14c199d
          path: native
          sparse-checkout: |
            resource_pack/particles
            resource_pack/textures/particle
            resource_pack/sounds
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Collect fixed-version constructor reference (no full game archive)
        run: python bedrock/tools/effects/collect_reference.py vanilla-reference
      - name: Record pinned sources and run available effect tests
        run: |
          printf 'Bedrock: ' > SOURCE_COMMITS.txt
          git -C bedrock rev-parse HEAD >> SOURCE_COMMITS.txt
          printf 'Java: ' >> SOURCE_COMMITS.txt
          git -C java rev-parse HEAD >> SOURCE_COMMITS.txt
          printf 'Native samples: ' >> SOURCE_COMMITS.txt
          git -C native rev-parse HEAD >> SOURCE_COMMITS.txt
          if test -f bedrock/tools/effects/effects-regression.test.mjs; then
            (cd bedrock && node --experimental-vm-modules --test tools/effects/effects-regression.test.mjs)
          fi
          if test -f bedrock/tools/effects/interaction-regression.test.mjs; then
            (cd bedrock && node --experimental-vm-modules --test tools/effects/interaction-regression.test.mjs)
          fi
          if test -f bedrock/tools/tap/tap-regression.test.mjs; then
            (cd bedrock && node --experimental-vm-modules --test tools/tap/tap-regression.test.mjs)
          fi
      - name: Pack inspectable source evidence even when a test fails
        if: always()
        run: tar --exclude='.git' --exclude='node_modules' --exclude='*.fsb' -czf effects-source-snapshot.tar.gz bedrock java native vanilla-reference SOURCE_COMMITS.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: effects-source-snapshot
          path: effects-source-snapshot.tar.gz
          retention-days: 7
