name: Effects parity regression
on:
  push:
    branches: ['fix/effects-parity-20260928']
    paths: ['.github/workflows/effects-parity.yml', 'tools/effects/**', 'tools/tap/**', 'tools/build_incense_emitters.py', 'runtime/**', 'docs/EFFECTS-*']
  pull_request:
    paths: ['.github/workflows/effects-parity.yml', 'tools/effects/**', 'tools/tap/**', 'tools/build_incense_emitters.py', 'runtime/**', 'docs/EFFECTS-*']
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install Pillow==11.3.0
      - name: Run effects regression (includes the 19 tap tests once)
        run: |
          set -o pipefail
          node --experimental-vm-modules --test tools/effects/effects-regression.test.mjs | tee effects-tests.tap
      - name: Parse scripts and JSON; check deterministic regeneration
        run: |
          python - <<'PY'
          import json,subprocess
          from pathlib import Path
          scripts=list(Path('runtime/BP/scripts').rglob('*.js'))
          resources=list(Path('runtime').rglob('*.json'))
          for p in resources:json.loads(p.read_text())
          for p in scripts:subprocess.run(['node','--check',str(p)],check=True)
          Path('effects-static-checks.json').write_text(json.dumps({'scripts':len(scripts),'json':len(resources),'result':'passed','bds':'NOT RUN','native_client':'NOT RUN','native_molang_parser':'NOT RUN'},indent=2)+'\n')
          PY
          git diff --exit-code -- runtime/RP/particles tools/effects/tap-drip-reference.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: effects-regression-evidence
          path: |
            effects-tests.tap
            effects-static-checks.json
            docs/EFFECTS-PARITY-AUDIT-20260928.md
            docs/effects-source-index-20260928.json
          retention-days: 14
