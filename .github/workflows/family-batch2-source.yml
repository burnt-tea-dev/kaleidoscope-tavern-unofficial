name: Family batch2 source reference
on:
  push:
    branches: ['fix/family-compat-batch2-20260929']
    paths: ['.github/workflows/family-batch2-source.yml']
permissions:
  contents: read
jobs:
  source:
    if: github.repository == 'casama233/kaleidoscope-tavern-unofficial' && github.repository_id == '1377171148'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: tavern-src
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: casama233/kaleidoscope-grilling-unofficial
          ref: 1ed332a5410e28290c80cc27cb971658864733ef
          path: grilling-src
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: casama233/kaleidoscope-world-liquor-unofficial
          ref: c7cb20428c8407c5d1ca2e7d9251303616fd4027
          path: world-liquor-src
          persist-credentials: false
      - name: Archive owned sources and public declarative references only
        run: |
          mkdir reference
          for repo in tavern-src grilling-src world-liquor-src; do
            git -C "$repo" archive --format=zip HEAD > "reference/$repo.zip"
            git -C "$repo" rev-parse HEAD > "reference/$repo.commit"
          done
          python - <<'PY'
          import hashlib,io,json,urllib.request,zipfile
          from pathlib import Path
          lock=json.loads(Path('tavern-src/compat/family/source-lock.json').read_text())
          facts={}
          with zipfile.ZipFile('reference/public-descriptors.zip','w',zipfile.ZIP_DEFLATED) as out:
              for row in lock['packs']:
                  with urllib.request.urlopen(row['url'],timeout=120) as r:raw=r.read()
                  assert hashlib.sha256(raw).hexdigest()==row['sha256'],row['key']
                  with zipfile.ZipFile(io.BytesIO(raw)) as z:
                      facts[row['key']]={n:hashlib.sha256(z.read(n)).hexdigest() for n in z.namelist() if not n.endswith('/')}
                      for n in z.namelist():
                          if n.endswith('.json') or ('documentation/' in n and n.endswith('.md')) or n.endswith('.lang'):
                              out.writestr(row['key']+'/'+n,z.read(n))
                      for n in z.namelist():
                          if not n.endswith('.js'):continue
                          lines=z.read(n).decode('utf-8-sig').splitlines()
                          # Only small contextual excerpts for the three audited defects;
                          # never archive vendor packs or complete script directories.
                          needles=['mechanicsByLocale','sendCommandFeedback','yangzhou_fried_rice','raw_ham']
                          hits=[i for i,s in enumerate(lines) if any(k in s for k in needles)]
                          indices=sorted({j for i in hits for j in range(max(0,i-14),min(len(lines),i+20))})
                          if indices:
                              text='\n'.join(str(j+1)+': '+lines[j] for j in indices)
                              out.writestr(row['key']+'/excerpts/'+n+'.txt',text)
          Path('reference/vendor-file-hashes.json').write_text(json.dumps(facts,ensure_ascii=False,indent=2)+'\n')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: family-batch2-references
          path: reference/
          retention-days: 2
