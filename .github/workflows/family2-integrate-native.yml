name: Family2 native integration
on:
  push:
    branches: ['fix/family-compat-batch2-20260929']
    paths: ['.github/workflows/family2-integrate-native.yml']
permissions:
  contents: read
concurrency:
  group: family2-native-integration
  cancel-in-progress: false
jobs:
  native:
    if: github.repository == 'casama233/kaleidoscope-tavern-unofficial' && github.repository_id == '1377171148' && github.ref == 'refs/heads/fix/family-compat-batch2-20260929'
    runs-on: ubuntu-latest
    timeout-minutes: 16
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: tavern-src
      - uses: actions/checkout@v4
        with:
          repository: casama233/kaleidoscope-grilling-unofficial
          ref: d195390b5351e9ac2cb44248247afc058771afab
          path: grilling-src
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: casama233/kaleidoscope-grilling-unofficial
          ref: 1ed332a5410e28290c80cc27cb971658864733ef
          path: grilling-baseline
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: casama233/kaleidoscope-world-liquor-unofficial
          ref: c7cb20428c8407c5d1ca2e7d9251303616fd4027
          path: world-liquor-src
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Reconstruct five exact owned tools and correct the language expectation
        working-directory: tavern-src
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import base64,hashlib,json,lzma,subprocess
          from pathlib import Path,PurePosixPath
          blob=json.loads(subprocess.check_output(['gh','api','repos/casama233/kaleidoscope-tavern-unofficial/git/blobs/6443c3e8da1c627ecb46f708b1597ce6dede736f']))
          raw=lzma.decompress(base64.b64decode(blob['content']))
          assert hashlib.sha256(raw).hexdigest()=='800f854b7079e1d191f3b7f4694f501e869057d97d0ebb79b9c1250862c049b9'
          changes=json.loads(raw);assert len(changes)==5
          for row in changes:
              name=row['path'];p=Path(name);parts=PurePosixPath(name)
              assert not parts.is_absolute() and '..' not in parts.parts and name.startswith('tools/') and not p.exists() and row['before'] is None
              text=''
              for a,b,value in reversed(row['edits']):assert a==b==0;text=value
              assert hashlib.sha256(text.encode()).hexdigest()==row['after']
              p.parent.mkdir(parents=True,exist_ok=True);p.write_text(text)
          p=Path('tools/family_batch2_native.py');s=p.read_text()
          old="  checks['localizedInstructionsRestored']=all(fg[k]['localizedEntries']>0 and fg[k]['localeKeys']==['en_US','zh_CN','zh_TW'] for k in fg)"
          new="""  # Public End/Nether/Chinese Food declare 29 locales, not only our three.
            # Verify against each exact input's RP declaration; do not delete valid languages.
            roots={'kaleidoscope_chinesefood:guidebook':inputs/'chinese-food-1.0.4',
             'kaleidoscope_nether:guidebook':inputs/'nether-1.0.1','kaleidoscope_end:guidebook':inputs/'end-1.0.1',
             'kaleidoscope_tavern:tavern':ROOT/'runtime','kg_a1:grilling':a.grilling_root/'projects/grilling/gameplay_core'}
            declared={k:sorted(read(pair(v)['RP'][0]/'texts/languages.json')) for k,v in roots.items()}
            save(out/'EXPECTED-GUIDE-LOCALES.json',declared)
            checks['localizedInstructionsRestored']=set(fg)==set(declared) and all(
             s['guides'] and all(g['localizedEntries']>0 and g['localeKeys']==declared[g['id']] for g in s['guides'][0]['guides'])
             for s in [fixed,restart])"""
          assert s.count(old)==1;s=s.replace(old,new)
          old2=" checks['allNoPlayers']=all(s['observer'] and all(p['players']==0 for p in s['observer']) for s in summaries)"
          new2=old2+"\n checks['worldLiquorAck']=all(any(x.get('source')=='kaleidoscope_world_liquor' and x.get('ok') is True for x in records((out/(s['case']+'.log')).read_text(),'[FAMILY1-EVENT] kaleidoscope_tavern:extension_ack ')) for s in summaries)\n checks['familyKnifeTags']=all(all(p['knives'].get(k) is True for p in s['observer'] for k in ['kaleidoscope_end:dragon_tooth_knife','kaleidoscope_nether:primitive_machete']) for s in summaries)"
          assert s.count(old2)==1;s=s.replace(old2,new2);p.write_text(s)
          assert hashlib.sha256(p.read_bytes()).hexdigest()=='5c1d907ebf832bba047030ea8e19c78b4f131883521623e39baa9a264055f034'
          PY
      - name: Build exact candidates and static source checks
        run: |
          python -m py_compile tavern-src/tools/build_family_vendor_patches.py tavern-src/tools/family_batch2_native.py
          python tavern-src/tools/family_candidate.py --build
          python world-liquor-src/tools/family_candidate.py --build
          python grilling-src/tools/check_station_storage.py
          (cd grilling-src && node tools/check_family_knives.mjs)
          python grilling-src/tools/family_candidate.py --build
          python tavern-src/tools/build_deco_compat.py
          python - <<'PY'
          import hashlib,json,subprocess
          from pathlib import Path
          files={
            'tavern-src/dist/family/Kaleidoscope_Tavern_Unofficial_0.6.64_compat1.mcaddon':'d46e95299071763bb34bc79eeb5062430671af1400c37cf2268c9168f95f0387',
            'world-liquor-src/dist/family/Kaleidoscope_World_Liquor_Unofficial_0.1.28_compat1.mcaddon':'419c73afa6309df8d8e6307ff240bb05592f6d7f6ec727867aac305c20ad8cac',
            'grilling-src/dist/family/Kaleidoscope_Grilling_A2.8.9_compat2.mcaddon':'15ebdf47397c397fa9c39584f6fcbb57ca5be2ad4c16513d979c737d06c5952a'}
          for path,expected in files.items():assert hashlib.sha256(Path(path).read_bytes()).hexdigest()==expected,path
          Path('SOURCE-COMMITS.json').write_text(json.dumps({p:subprocess.check_output(['git','-C',p,'rev-parse','HEAD'],text=True).strip() for p in ['tavern-src','grilling-src','grilling-baseline','world-liquor-src']},indent=2)+'\n')
          PY
      - name: Native control, nonexperimental stable storage, and same-world restart
        run: python tavern-src/tools/family_batch2_native.py --liquor-root world-liquor-src --grilling-root grilling-src --grilling-baseline grilling-baseline --work "$RUNNER_TEMP/family2-native"
      - name: Commit accepted owned tools only on the candidate branch
        working-directory: tavern-src
        env:
          EXPECTED_HEAD: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/fix/family-compat-batch2-20260929 | cut -f1)" = "$EXPECTED_HEAD"
          git diff --exit-code -- .github/ runtime/
          git add tools/build_family_vendor_patches.py tools/family_batch2_native.py tools/fixtures/family2/
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Add native-verified family2 storage and opt-in vendor patch acceptance tools'
          git push origin HEAD:refs/heads/fix/family-compat-batch2-20260929
          git rev-parse HEAD > "$RUNNER_TEMP/family2-native/evidence/TOOLS_SOURCE_COMMIT"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Family2-native-evidence
          path: |
            ${{ runner.temp }}/family2-native/evidence/
            SOURCE-COMMITS.json
            tavern-src/tools/build_family_vendor_patches.py
            tavern-src/tools/family_batch2_native.py
            tavern-src/tools/fixtures/family2/
            tavern-src/dist/family/
            world-liquor-src/dist/family/
            grilling-src/dist/family/
          retention-days: 14
