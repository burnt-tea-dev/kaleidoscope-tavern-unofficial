name: Integrate reviewed Java storage repair
on:
  push:
    branches: ['fix/java-storage-bottle-transforms']
    paths: ['.github/workflows/storage-repair-apply.yml', '.github/storage-repair-input/**']
permissions:
  contents: read
concurrency:
  group: tavern-storage-repair-integration
  cancel-in-progress: false
jobs:
  integrate:
    if: github.repository == 'casama233/kaleidoscope-tavern-unofficial' && github.repository_id == '1377171148' && github.ref == 'refs/heads/fix/java-storage-bottle-transforms'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: tavern-src
      - uses: actions/checkout@v4
        with:
          repository: KaleidoscopeMods/KaleidoscopeTavern
          ref: c4ec1880bd44cf3139d3ba744ab30bb379cf1416
          path: java-src
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: casama233/kaleidoscope-world-liquor-unofficial
          ref: 950dc1de414bd18ccdd5329629900acd662bbcc2
          path: world-liquor-src
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install Pillow==11.3.0
      - name: Apply exact reviewed source delta
        working-directory: tavern-src
        run: |
          python - <<'PY'
          import base64,hashlib,lzma,subprocess
          from pathlib import Path
          parts=sorted(Path('.github/storage-repair-input').glob('part-*.b64'))
          assert len(parts)==4
          raw=lzma.decompress(base64.b64decode(''.join(p.read_text().strip() for p in parts),validate=True))
          assert hashlib.sha256(raw).hexdigest()=='a2ef3d1a9f9130aa0970d69633d4d426b6ceaf1db07da0582b63a86924948d32'
          subprocess.run(['git','apply','--check','-'],input=raw,check=True)
          subprocess.run(['git','apply','-'],input=raw,check=True)
          PY
      - name: Build and verify source-matrix parity (no player simulation)
        working-directory: tavern-src
        run: |
          python tools/build_storage_visuals.py
          python tools/check_release.py
          python tools/check_storage_rendering.py --java-source ../java-src --report docs/STORAGE-VALIDATION-0.6.40.json
          python tools/refresh_visual_compat.py --report docs/VISUAL-MATERIAL-AUDIT-0.6.40.json
          python tools/build_release.py
          python - <<'PY'
          import hashlib,subprocess,zipfile
          from pathlib import Path
          def snapshot():return {p.relative_to('runtime').as_posix():hashlib.sha256(p.read_bytes()).hexdigest() for p in Path('runtime').rglob('*') if p.is_file()}
          first=snapshot()
          subprocess.run(['python','tools/build_storage_visuals.py'],check=True)
          assert snapshot()==first,'Generator must be idempotent'
          p=Path('dist/Kaleidoscope_Tavern_Unofficial_0.6.40_beta1.mcaddon')
          actual=hashlib.sha256(p.read_bytes()).hexdigest()
          assert actual=='0470e58e73d50ab719eb17cdc9cf89fdfad9203d7555210f029da350c267a40a',actual
          with zipfile.ZipFile(p) as z:
              assert len(z.namelist())==len(set(z.namelist())) and set(z.namelist())==set(first)
              assert all(hashlib.sha256(z.read(n)).hexdigest()==h for n,h in first.items())
          print('Exact reviewed full package and every canonical runtime entry verified:',actual)
          PY
      - name: Commit canonical repair on its branch only
        working-directory: tavern-src
        env:
          EXPECTED_HEAD: ${{ github.sha }}
        run: |
          set -euo pipefail
          git diff --exit-code -- .github/
          test "$(git ls-remote origin refs/heads/fix/java-storage-bottle-transforms | cut -f1)" = "$EXPECTED_HEAD"
          git add runtime/ tools/ data/ docs/ README.md README.zh-TW.md package.json release.json
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Repair Java storage bottle origins and restore watermelon-juice display for 0.6.40'
          git push origin HEAD:refs/heads/fix/java-storage-bottle-transforms
          git rev-parse HEAD > dist/SOURCE_COMMIT
          git archive --format=zip HEAD > dist/integrated-source.zip
          git -C ../world-liquor-src archive --format=zip HEAD > dist/world-liquor-source.zip
          cp docs/STORAGE-VALIDATION-0.6.40.json dist/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Tavern-storage-repair-integration
          path: tavern-src/dist/
          retention-days: 7
