name: Validate particle Molang hotfix (temporary)
on:
  push:
    branches: [fix/particle-molang-064-20260929]
    paths: [.github/workflows/particle-molang-apply.yml]
permissions:
  contents: write
concurrency:
  group: particle-molang-hotfix-apply
  cancel-in-progress: false
jobs:
  repair:
    if: github.repository == 'casama233/kaleidoscope-tavern-unofficial' && github.ref == 'refs/heads/fix/particle-molang-064-20260929'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/checkout@v4
        with:
          repository: KaleidoscopeMods/KaleidoscopeTavern
          ref: c4ec1880bd44cf3139d3ba744ab30bb379cf1416
          path: .source-check/java
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install Pillow==11.3.0
      - name: Verify reviewed payload and apply source changes
        shell: python
        run: |
          import base64,hashlib,json,lzma,os,pathlib,subprocess
          root=pathlib.Path.cwd();tmp=pathlib.Path(os.environ['RUNNER_TEMP'])
          packed=base64.b64decode((root/'.particle-molang-change.b64').read_text().strip(),validate=True)
          assert hashlib.sha256(packed).hexdigest()=='88b3250204c3c9c4b564b6d64c1f923e0cfd1f57fa4f56c0e6c1c2dfdbe04a25'
          bundle=json.loads(lzma.decompress(packed))
          assert bundle['base']=='1547140897fa067ea60e990ecdd8d23a85fa6815'
          subprocess.run(['git','merge-base','--is-ancestor',bundle['base'],'HEAD'],check=True)
          assert len(bundle['paths'])==110 and len(set(bundle['paths']))==110
          for name in bundle['paths']:
              path=pathlib.PurePosixPath(name)
              assert not path.is_absolute() and '..' not in path.parts
              assert name.startswith(('runtime/RP/particles/','tools/','docs/','data/'))
          patch=tmp/'particle-molang.patch';patch.write_text(bundle['patch'])
          subprocess.run(['git','apply','--check',str(patch)],check=True)
          subprocess.run(['git','apply',str(patch)],check=True)
          (tmp/'particle-molang-bundle.json').write_text(json.dumps(bundle))
      - name: Regenerate particles and retain immutable before hashes
        shell: bash
        run: |
          set -euo pipefail
          python tools/effects/build_feedback_particles.py
          python tools/effects/build_interaction_particles.py
          python tools/effects/build_item_particle_atlas.py
          python tools/build_incense_emitters.py
          python - <<'PY'
          import hashlib,json,os,pathlib,subprocess
          root=pathlib.Path.cwd();bundle=json.loads((pathlib.Path(os.environ['RUNNER_TEMP'])/'particle-molang-bundle.json').read_text())
          path=root/'data/launch-repair-reference.json';original=json.loads(path.read_text());review=json.loads(path.read_text())
          for name in bundle['paths']:
              if not name.startswith('runtime/RP/particles/'):continue
              digest=hashlib.sha256((root/name).read_bytes()).hexdigest()
              if name in review['reviewedChanges']:
                  review['reviewedChanges'][name]['after']=digest
                  review['reviewedChanges'][name]['reason']+=' 0.6.64 Molang hotfix: expand compound assignments to explicit assignments; arithmetic order and all other JSON values retained.'
              else:
                  assert name in review['newRuntimeFiles'],name
                  review['newRuntimeFiles'][name]=digest
          for name,row in original['reviewedChanges'].items():
              for field in ('before','beforeProjected'):
                  assert row.get(field)==review['reviewedChanges'][name].get(field),(name,field)
          path.write_text(json.dumps(review,ensure_ascii=False,indent=2)+'\n')
          manifest={name:hashlib.sha256((root/name).read_bytes()).hexdigest() for name in bundle['paths']}
          assert hashlib.sha256(json.dumps(manifest,sort_keys=True,separators=(',',':')).encode()).hexdigest()==bundle['outputSHA256']
          print('Reproduced all 110 reviewed files; original before hashes retained')
          PY
      - name: Prove the reported version fails and only assignment syntax changes
        shell: python
        run: |
          import json,os,pathlib,re,subprocess,sys
          root=pathlib.Path.cwd();evidence=root/'evidence';evidence.mkdir(exist_ok=True)
          oldroot=pathlib.Path(os.environ['RUNNER_TEMP'])/'particle-molang-old';oldroot.mkdir()
          base='1547140897fa067ea60e990ecdd8d23a85fa6815'
          token=re.compile(r'(variable\.[A-Za-z0-9_]+)([+*/-])=([^;]+);')
          def expand(value):
              if isinstance(value,dict):return {k:expand(v) for k,v in value.items()}
              if isinstance(value,list):return [expand(v) for v in value]
              if isinstance(value,str):return token.sub(lambda m:f'{m[1]}={m[1]}{m[2]}({m[3]});',value)
              return value
          changed=0;files=sorted((root/'runtime/RP/particles').glob('*.json'))
          for path in files:
              name=path.relative_to(root).as_posix()
              before=subprocess.check_output(['git','show',base+':'+name]);(oldroot/path.name).write_bytes(before)
              old=json.loads(before);new=json.loads(path.read_text())
              assert expand(old)==new,'Non-syntax change: '+name
              changed+=old!=new
          result=subprocess.run([sys.executable,'tools/effects/check_molang.py','--root',str(oldroot),'--report',str(evidence/'reported-version-molang.json')],capture_output=True,text=True)
          (evidence/'reported-version-molang.log').write_text(result.stdout+result.stderr)
          report=json.loads((evidence/'reported-version-molang.json').read_text())
          assert result.returncode==1 and report['compoundAssignments']==1040
          assert len(files)==107 and changed==97
          summary={'base':base,'particleFiles':len(files),'changedParticles':changed,'unsupportedAssignmentsBefore':1040,'onlyAssignmentSyntaxChanged':True,'nativeClientTested':False}
          (evidence/'repair-proof.json').write_text(json.dumps(summary,indent=2)+'\n');print(json.dumps(summary))
      - name: Syntax and existing numerical interaction regressions
        shell: bash
        run: |
          set -euo pipefail
          python tools/effects/test_molang_syntax.py 2>&1 | tee evidence/molang-unit-tests.log
          python tools/effects/check_molang.py --report evidence/fixed-runtime-molang.json 2>&1 | tee evidence/fixed-runtime-molang.log
          node --experimental-vm-modules --test tools/effects/effects-regression.test.mjs tools/effects/interaction-regression.test.mjs 2>&1 | tee evidence/effect-regressions.tap
      - name: Full release checks and original Java and launch baseline
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .source-check/baseline
          git archive cedfaedf6140bae61b24afb658869b1d0e6ea1a9 | tar -x -C .source-check/baseline
          python tools/check_release.py 2>&1 | tee evidence/release-checks.log
          python tools/check_launch.py --java-source .source-check/java --baseline .source-check/baseline 2>&1 | tee evidence/launch-baseline.log
          python tools/build_release.py 2>&1 | tee evidence/build.log
          sha256sum dist/*.mcaddon | tee evidence/SHA256SUMS
      - name: Commit only verified repairs and remove transport
        shell: python
        run: |
          import hashlib,json,os,pathlib,subprocess
          def git(*args):return subprocess.check_output(['git',*args],text=True).strip()
          root=pathlib.Path.cwd();bundle=json.loads((pathlib.Path(os.environ['RUNNER_TEMP'])/'particle-molang-bundle.json').read_text());paths=bundle['paths']
          manifest={name:hashlib.sha256((root/name).read_bytes()).hexdigest() for name in paths}
          assert hashlib.sha256(json.dumps(manifest,sort_keys=True,separators=(',',':')).encode()).hexdigest()==bundle['outputSHA256'],'Validation modified reviewed files'
          branch='refs/heads/fix/particle-molang-064-20260929'
          assert git('ls-remote','origin',branch).split()[0]==os.environ['GITHUB_SHA'],'Branch advanced; refusing to overwrite'
          subprocess.run(['git','add','--',*paths],check=True)
          subprocess.run(['git','rm','--','.particle-molang-change.b64'],check=True)
          assert set(git('diff','--cached','--name-only').splitlines())==set(paths)|{'.particle-molang-change.b64'}
          git('config','user.name','github-actions[bot]');git('config','user.email','41898282+github-actions[bot]@users.noreply.github.com')
          subprocess.run(['git','commit','-m','fix: emit valid Molang assignments and guard particle generators'],check=True)
          subprocess.run(['git','push','origin','HEAD:'+branch],check=True)
          (root/'evidence/HOTFIX_COMMIT').write_text(git('rev-parse','HEAD')+'\n')
          print('HOTFIX_COMMIT='+git('rev-parse','HEAD'))
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: particle-molang-hotfix-validation
          path: evidence/
          retention-days: 14
          if-no-files-found: warn
