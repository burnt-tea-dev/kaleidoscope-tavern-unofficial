name: Launch and tipsy audit sources
on:
  push:
    branches: ['fix/java-launch-tipsy-20260925']
    paths: ['.github/workflows/launch-audit-snapshot.yml']
permissions:
  contents: read
jobs:
  snapshot:
    if: github.repository == 'casama233/kaleidoscope-tavern-unofficial' && github.repository_id == '1377171148'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: e4ce3cad4d8f2ac601a19eb7558fb791bcfcd855
          path: tavern-src
          persist-credentials: false
      - name: Archive exact new main and revision
        run: |
          mkdir snapshots
          git -C tavern-src rev-parse HEAD > snapshots/tavern-main.commit
          git -C tavern-src archive --format=zip HEAD > snapshots/tavern-main.zip
      - uses: actions/upload-artifact@v4
        with:
          name: launch-new-main-source
          path: snapshots/*
          retention-days: 7
